<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>じゃんけんゲーム</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #111;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 500px;
  padding: 25px;
  text-align: center;
}

h1 {
  font-size: 32px;
}

#computer {
  font-size: 70px;
  margin: 20px;
}

#result {
  font-size: 28px;
  min-height: 40px;
  margin: 20px;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

button {
  flex: 1;
  padding: 20px 10px;
  font-size: 24px;
  border: none;
  border-radius: 15px;
  background: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

.score {
  margin-top: 30px;
  font-size: 18px;
}

.reset {
  margin-top: 20px;
  font-size: 16px;
  padding: 12px 20px;
}

</style>
</head>

<body>

<div class="container">

<h1>✊ じゃんけん</h1>

<div>CPU</div>

<div id="computer">❓</div>

<div id="result">
あなたの手を選んで！
</div>

<div class="buttons">

<button onclick="play('グー')">
✊<br>グー
</button>

<button onclick="play('チョキ')">
✌️<br>チョキ
</button>

<button onclick="play('パー')">
✋<br>パー
</button>

</div>

<div class="score">

勝ち：<span id="win">0</span><br>
負け：<span id="lose">0</span><br>
引き分け：<span id="draw">0</span>

</div>

<button class="reset" onclick="resetScore()">
記録をリセット
</button>

</div>

<script>

let win = Number(localStorage.getItem("win")) || 0;
let lose = Number(localStorage.getItem("lose")) || 0;
let draw = Number(localStorage.getItem("draw")) || 0;

updateScore();

function play(player) {

  const hands = ["グー", "チョキ", "パー"];

  const cpu = hands[Math.floor(Math.random() * 3)];

  const emoji = {
    "グー": "✊",
    "チョキ": "✌️",
    "パー": "✋"
  };

  document.getElementById("computer").textContent = emoji[cpu];

  let result;

  if (player === cpu) {

    result = "引き分け！";
    draw++;

  } else if (

    (player === "グー" && cpu === "チョキ") ||
    (player === "チョキ" && cpu === "パー") ||
    (player === "パー" && cpu === "グー")

  ) {

    result = "🎉 あなたの勝ち！";
    win++;

  } else {

    result = "😈 あなたの負け！";
    lose++;

  }

  document.getElementById("result").textContent = result;

  saveScore();
  updateScore();

}

function saveScore() {

  localStorage.setItem("win", win);
  localStorage.setItem("lose", lose);
  localStorage.setItem("draw", draw);

}

function updateScore() {

  document.getElementById("win").textContent = win;
  document.getElementById("lose").textContent = lose;
  document.getElementById("draw").textContent = draw;

}

function resetScore() {

  win = 0;
  lose = 0;
  draw = 0;

  saveScore();
  updateScore();

  document.getElementById("computer").textContent = "❓";
  document.getElementById("result").textContent = "記録をリセットしました";

}

</script>

</body>
</html>
