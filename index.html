<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RED OR DEAD</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090d;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  touch-action:manipulation;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:600px;
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#20243a 0%,#0d0f18 42%,#05060a 100%);
}

#game.shake{
  animation:shake .18s linear;
}

@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(8px,-5px)}
  50%{transform:translate(-7px,5px)}
  75%{transform:translate(5px,3px)}
  100%{transform:translate(0)}
}

#hud{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:20;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.stat{
  text-align:center;
  min-width:65px;
}

.label{
  font-size:10px;
  color:#8f95a8;
  letter-spacing:1px;
  font-weight:800;
}

.value{
  font-size:22px;
  font-weight:900;
  line-height:1.1;
}

#score{
  font-size:28px;
}

#combo{
  color:#ffe45c;
}

#lives{
  color:#ff4d6d;
  letter-spacing:2px;
}

#arena{
  position:absolute;
  inset:80px 0 0;
  overflow:hidden;
}

.target{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:clamp(20px,7vw,36px);
  font-weight:900;
  transform:translate(-50%,-50%) scale(.2);
  animation:appear .12s ease-out forwards;
  box-shadow:0 0 25px rgba(255,255,255,.12);
  z-index:5;
}

.target.safe{
  background:
    radial-gradient(circle at 35% 30%,#fff 0%,#8cffb0 7%,#20df72 45%,#087d42 100%);
  border:3px solid #baffd0;
  box-shadow:
    0 0 20px rgba(32,223,114,.55),
    inset 0 0 15px rgba(255,255,255,.4);
}

.target.bomb{
  background:
    radial-gradient(circle at 35% 30%,#ff9c9c 0%,#ff304d 12%,#9c0923 55%,#3d0610 100%);
  border:3px solid #ff647a;
  box-shadow:
    0 0 25px rgba(255,35,65,.7),
    inset 0 0 15px rgba(255,255,255,.2);
}

.target.gold{
  background:
    radial-gradient(circle at 35% 30%,#fff 0%,#fff59a 8%,#ffd21f 45%,#bd7100 100%);
  border:3px solid #fff4a0;
  box-shadow:
    0 0 30px rgba(255,210,30,.85),
    inset 0 0 15px rgba(255,255,255,.5);
}

.target.fake{
  opacity:.85;
  filter:saturate(.7);
}

@keyframes appear{
  to{transform:translate(-50%,-50%) scale(1)}
}

.target.hit{
  animation:hit .18s ease-out forwards;
}

@keyframes hit{
  to{
    transform:translate(-50%,-50%) scale(1.7);
    opacity:0;
  }
}

#message{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:15;
  pointer-events:none;
  width:90%;
}

#message .big{
  font-size:clamp(34px,11vw,64px);
  font-weight:1000;
  letter-spacing:2px;
  text-shadow:0 5px 30px rgba(0,0,0,.7);
}

#message .small{
  margin-top:8px;
  color:#aeb4c8;
  font-size:14px;
  font-weight:700;
}

.pop{
  position:absolute;
  pointer-events:none;
  z-index:30;
  font-weight:1000;
  font-size:25px;
  animation:pop .65s ease-out forwards;
}

@keyframes pop{
  0%{
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
  }
  20%{
    transform:translate(-50%,-70%) scale(1.2);
    opacity:1;
  }
  100%{
    transform:translate(-50%,-150%) scale(1);
    opacity:0;
  }
}

.particle{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  pointer-events:none;
  z-index:25;
  animation:particle .5s ease-out forwards;
}

@keyframes particle{
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

#startScreen,
#gameOver{
  position:absolute;
  inset:0;
  z-index:50;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,40,65,.18),transparent 35%),
    rgba(4,5,9,.94);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.hidden{
  display:none!important;
}

.logo{
  font-size:clamp(42px,13vw,76px);
  line-height:.9;
  font-weight:1000;
  letter-spacing:-3px;
}

.logo span{
  color:#ff304d;
}

.subtitle{
  margin-top:14px;
  color:#aeb4c8;
  font-size:14px;
  line-height:1.7;
}

.howto{
  margin-top:24px;
  width:min(350px,90%);
  padding:16px;
  border:1px solid #292d3d;
  background:#11131b;
  border-radius:18px;
  font-size:14px;
  line-height:1.8;
}

.howto b{
  color:#65ff9a;
}

.howto .danger{
  color:#ff5268;
}

button{
  border:0;
  color:white;
  font-weight:1000;
  cursor:pointer;
}

.mainBtn{
  margin-top:24px;
  width:min(330px,90%);
  padding:17px 20px;
  border-radius:17px;
  font-size:19px;
  background:linear-gradient(135deg,#ff304d,#b90024);
  box-shadow:0 8px 30px rgba(255,30,65,.28);
}

.mainBtn:active{
  transform:scale(.96);
}

.secondary{
  margin-top:12px;
  background:#171a24;
  border:1px solid #303547;
  padding:12px 25px;
  border-radius:12px;
  font-size:13px;
}

#resultTitle{
  color:#ff4059;
  font-size:16px;
  font-weight:900;
  letter-spacing:2px;
}

#finalScore{
  margin-top:4px;
  font-size:68px;
  font-weight:1000;
}

.resultLine{
  margin-top:4px;
  color:#aeb4c8;
  font-size:14px;
}

#newRecord{
  margin-top:12px;
  color:#ffe45c;
  font-weight:1000;
  font-size:14px;
}

#progress{
  position:absolute;
  top:76px;
  left:16px;
  right:16px;
  height:4px;
  background:#252938;
  border-radius:10px;
  overflow:hidden;
  z-index:21;
}

#progressBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#40ff91,#ffe34e,#ff304d);
  transition:width .2s;
}

#fever{
  position:absolute;
  top:88px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  font-weight:1000;
  font-size:12px;
  color:#ffe45c;
  opacity:0;
  transition:.2s;
}

#fever.active{
  opacity:1;
  animation:feverPulse .45s infinite alternate;
}

@keyframes feverPulse{
  from{transform:translateX(-50%) scale(1)}
  to{transform:translateX(-50%) scale(1.15)}
}

#coinHud{
  position:absolute;
  bottom:12px;
  right:14px;
  z-index:20;
  font-size:12px;
  color:#ffd84c;
  font-weight:900;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div class="stat">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="stat">
      <div class="label">COMBO</div>
      <div class="value" id="combo">x1</div>
    </div>

    <div class="stat">
      <div class="label">LIFE</div>
      <div class="value" id="lives">♥♥♥</div>
    </div>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <div id="fever">🔥 FEVER MODE 🔥</div>

  <div id="arena"></div>

  <div id="message">
    <div class="big"></div>
    <div class="small"></div>
  </div>

  <div id="coinHud">🪙 0</div>

  <!-- START -->

  <div id="startScreen">

    <div class="logo">RED<br><span>OR DEAD</span></div>

    <div class="subtitle">
      一瞬の判断で、どこまで生き残れる？
    </div>

    <div class="howto">
      🟢 <b>SAFE</b> → タップ<br>
      🟡 <b>GOLD</b> → タップすると大量得点<br>
      🔴 <span class="danger">BOMB</span> → 絶対にタップしない<br>
      <br>
      コンボを繋げるほどスピードアップ。
    </div>

    <button class="mainBtn" id="startBtn">
      GAME START
    </button>

    <button class="secondary" id="resetBtn">
      データをリセット
    </button>

  </div>

  <!-- GAME OVER -->

  <div id="gameOver" class="hidden">

    <div id="resultTitle">GAME OVER</div>

    <div id="finalScore">0</div>

    <div class="resultLine">
      BEST SCORE　<span id="bestScore">0</span>
    </div>

    <div class="resultLine">
      BEST COMBO　<span id="bestCombo">0</span>
    </div>

    <div id="newRecord" class="hidden">
      🏆 NEW RECORD
    </div>

    <button class="mainBtn" id="retryBtn">
      RETRY
    </button>

    <button class="secondary" id="homeBtn">
      TITLE
    </button>

  </div>

</div>

<script>
/* =========================
   RED OR DEAD
========================= */

const arena = document.getElementById("arena");
const game = document.getElementById("game");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const livesEl = document.getElementById("lives");
const progressBar = document.getElementById("progressBar");
const feverEl = document.getElementById("fever");
const coinHud = document.getElementById("coinHud");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");

const finalScore = document.getElementById("finalScore");
const bestScoreEl = document.getElementById("bestScore");
const bestComboEl = document.getElementById("bestCombo");
const newRecordEl = document.getElementById("newRecord");

const message = document.getElementById("message");

let score = 0;
let combo = 0;
let bestComboRun = 0;
let lives = 3;

let running = false;
let spawnTimer = null;
let lifeTimer = null;

let level = 0;
let elapsed = 0;
let fever = false;
let feverTimer = 0;

let coins = Number(localStorage.getItem("rod_coins") || 0);
let bestScore = Number(localStorage.getItem("rod_best") || 0);
let bestCombo = Number(localStorage.getItem("rod_combo") || 0);

coinHud.textContent = "🪙 " + coins;

/* ---------- SOUND ---------- */

let audioCtx = null;

function sound(freq, duration=.08, type="sine", volume=.04){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}

/* ---------- VIBRATION ---------- */

function vibrate(pattern){
  if(navigator.vibrate){
    navigator.vibrate(pattern);
  }
}

/* ---------- START ---------- */

function startGame(){

  startScreen.classList.add("hidden");
  gameOver.classList.add("hidden");

  arena.innerHTML = "";

  score = 0;
  combo = 0;
  bestComboRun = 0;
  lives = 3;
  level = 0;
  elapsed = 0;
  fever = false;
  feverTimer = 0;

  running = true;

  updateHUD();

  message.innerHTML = "";

  sound(500,.08);
  sound(750,.08);

  spawn();

  clearInterval(spawnTimer);
  clearInterval(lifeTimer);

  spawnTimer = setInterval(()=>{
    if(running) spawn();
  }, getSpawnRate());

  lifeTimer = setInterval(()=>{
    if(!running) return;

    elapsed++;

    level = Math.floor(elapsed / 7);

    if(fever){
      feverTimer--;

      if(feverTimer <= 0){
        fever = false;
        feverEl.classList.remove("active");
      }
    }

    progressBar.style.width =
      Math.min(100,(elapsed % 60) / 60 * 100) + "%";

  },1000);

  if(window.gameLoopRestart){
    clearInterval(window.gameLoopRestart);
  }

  window.gameLoopRestart = setInterval(()=>{
    if(!running) return;

    clearInterval(spawnTimer);

    spawnTimer = setInterval(()=>{
      if(running) spawn();
    },getSpawnRate());

  },1000);
}

/* ---------- DIFFICULTY ---------- */

function getSpawnRate(){

  /*
    1000ms → 250ms
    徐々に狂っていく
  */

  return Math.max(
    250,
    850 - level * 65 - Math.floor(combo / 5) * 25
  );
}

function getTargetSize(){

  return Math.max(
    48,
    84 - level * 3 - Math.floor(combo / 8) * 3
  );
}

/* ---------- SPAWN ---------- */

function spawn(){

  if(!running) return;

  const target = document.createElement("div");

  const size = getTargetSize();

  target.style.width = size + "px";
  target.style.height = size + "px";

  /*
    上部HUDを避ける
  */

  const rect = arena.getBoundingClientRect();

  const x = 12 + Math.random() * (rect.width - 24);
  const y = 50 + Math.random() * (rect.height - 90);

  target.style.left = x + "px";
  target.style.top = y + "px";

  /*
    基本はSAFE。
    コンボが上がるとBOMB率上昇。
  */

  let type = "safe";

  const bombChance =
    Math.min(.38, .12 + level * .025);

  const goldChance =
    Math.min(.08, .025 + level * .004);

  const r = Math.random();

  if(r < goldChance){
    type = "gold";
  }else if(r < goldChance + bombChance){
    type = "bomb";
  }

  target.className = "target " + type;

  if(type === "safe"){
    target.textContent = "✓";
  }

  if(type === "gold"){
    target.textContent = "★";
  }

  if(type === "bomb"){
    target.textContent = "☠";
  }

  arena.appendChild(target);

  /*
    タップされなければ消える。
    SAFE/GOLDを見逃すとダメージ。
    BOMBは見逃してOK。
  */

  const lifeTime = Math.max(
    650,
    1450 - level * 70 - combo * 8
  );

  const timeout = setTimeout(()=>{

    if(!target.isConnected) return;

    if(target.classList.contains("safe") ||
       target.classList.contains("gold")){

      missTarget(target);

    }else{

      target.remove();

    }

  },lifeTime);

  target.addEventListener("pointerdown",(e)=>{

    e.preventDefault();

    clearTimeout(timeout);

    handleTarget(target);

  });
}

/* ---------- TARGET ---------- */

function handleTarget(target){

  if(!running || target.classList.contains("hit")) return;

  target.classList.add("hit");

  const isBomb = target.classList.contains("bomb");
  const isGold = target.classList.contains("gold");

  if(isBomb){

    bombHit(target);

  }else{

    safeHit(target,isGold);

  }

  setTimeout(()=>{
    if(target.isConnected) target.remove();
  },200);
}

/* ---------- SAFE ---------- */

function safeHit(target,isGold){

  combo++;

  bestComboRun = Math.max(
    bestComboRun,
    combo
  );

  if(combo > bestCombo){
    bestCombo = combo;
    localStorage.setItem(
      "rod_combo",
      bestCombo
    );
  }

  let multiplier = getMultiplier();

  let gain;

  if(isGold){
    gain = 100 * multiplier;
    coins += 5;
    showPop(target,"+" + gain + " 🪙");
    sound(1100,.12,"triangle");
    vibrate([20,30,20]);
    activateFever();
  }else{
    gain = 10 * multiplier;
    coins += 1;

    showPop(
      target,
      "+" + gain
    );

    sound(
      500 + Math.min(combo,20)*25,
      .055,
      "sine"
    );

    vibrate(10);
  }

  score += gain;

  localStorage.setItem(
    "rod_coins",
    coins
  );

  coinHud.textContent = "🪙 " + coins;

  /*
    10コンボごとにFEVER
  */

  if(combo > 0 && combo % 10 === 0){
    activateFever();
  }

  particles(
    target,
    isGold ? 18 : 9
  );

  updateHUD();
}

/* ---------- BOMB ---------- */

function bombHit(target){

  loseLife();

  combo = 0;

  showPop(
    target,
    "💥 BOMB!"
  );

  sound(90,.25,"sawtooth",.07);
  vibrate([80,50,120]);

  game.classList.remove("shake");

  /*
    force reflow
  */
  void game.offsetWidth;

  game.classList.add("shake");

  particles(target,15);

  updateHUD();
}

/* ---------- MISS ---------- */

function missTarget(target){

  target.remove();

  loseLife();

  combo = 0;

  showCenterMessage(
    "MISS!",
    "次は見逃すな"
  );

  sound(130,.16,"square",.04);
  vibrate(70);

  updateHUD();
}

/* ---------- LIFE ---------- */

function loseLife(){

  lives--;

  if(lives <= 0){
    endGame();
  }
}

/* ---------- MULTIPLIER ---------- */

function getMultiplier(){

  if(combo >= 25) return 5;
  if(combo >= 15) return 3;
  if(combo >= 8) return 2;

  return 1;
}

/* ---------- FEVER ---------- */

function activateFever(){

  fever = true;
  feverTimer = 6;

  feverEl.classList.add("active");

  sound(900,.08,"triangle");
  sound(1200,.12,"triangle");

  showCenterMessage(
    "🔥 FEVER!",
    "スコア2倍"
  );
}

/* ---------- POP ---------- */

function showPop(target,text){

  const p = document.createElement("div");

  p.className = "pop";
  p.textContent = text;

  p.style.left = target.style.left;
  p.style.top = target.style.top;

  if(text.includes("BOMB")){
    p.style.color = "#ff4059";
  }else if(text.includes("🪙")){
    p.style.color = "#ffe45c";
  }else{
    p.style.color = "#75ffab";
  }

  arena.appendChild(p);

  setTimeout(()=>{
    p.remove();
  },700);
}

/* ---------- CENTER MESSAGE ---------- */

let messageTimer;

function showCenterMessage(big,small){

  clearTimeout(messageTimer);

  message.innerHTML = `
    <div class="big">${big}</div>
    <div class="small">${small}</div>
  `;

  messageTimer = setTimeout(()=>{
    message.innerHTML = "";
  },800);
}

/* ---------- PARTICLES ---------- */

function particles(target,count){

  const rect = arena.getBoundingClientRect();

  const x = parseFloat(target.style.left);
  const y = parseFloat(target.style.top);

  for(let i=0;i<count;i++){

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left = x + "px";
    p.style.top = y + "px";

    const angle = Math.random()*Math.PI*2;
    const distance = 30 + Math.random()*70;

    p.style.setProperty(
      "--x",
      Math.cos(angle)*distance + "px"
    );

    p.style.setProperty(
      "--y",
      Math.sin(angle)*distance + "px"
    );

    arena.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },550);
  }
}

/* ---------- HUD ---------- */

function updateHUD(){

  scoreEl.textContent =
    score.toLocaleString();

  comboEl.textContent =
    "x" + getMultiplier();

  if(combo >= 8){
    comboEl.style.color = "#ffe45c";
  }else{
    comboEl.style.color = "#ffffff";
  }

  livesEl.textContent =
    "♥".repeat(Math.max(0,lives)) +
    "♡".repeat(Math.max(0,3-lives));

}

/* ---------- GAME OVER ---------- */

function endGame(){

  running = false;

  clearInterval(spawnTimer);
  clearInterval(lifeTimer);

  if(window.gameLoopRestart){
    clearInterval(window.gameLoopRestart);
  }

  arena.innerHTML = "";

  const oldBest = bestScore;

  const isNewRecord =
    score > oldBest;

  if(isNewRecord){
    bestScore = score;

    localStorage.setItem(
      "rod_best",
      bestScore
    );
  }

  finalScore.textContent =
    score.toLocaleString();

  bestScoreEl.textContent =
    bestScore.toLocaleString();

  bestComboEl.textContent =
    bestComboRun;

  newRecordEl.classList.toggle(
    "hidden",
    !isNewRecord
  );

  gameOver.classList.remove("hidden");

  if(isNewRecord){
    sound(700,.1,"triangle");
    setTimeout(()=>{
      sound(1000,.15,"triangle");
    },100);
  }else{
    sound(100,.25,"sawtooth");
  }
}

/* ---------- BUTTONS ---------- */

document.getElementById("startBtn")
  .addEventListener("click",startGame);

document.getElementById("retryBtn")
  .addEventListener("click",startGame);

document.getElementById("homeBtn")
  .addEventListener("click",()=>{

    gameOver.classList.add("hidden");
    startScreen.classList.remove("hidden");

  });

document.getElementById("resetBtn")
  .addEventListener("click",()=>{

    if(!confirm("スコア・コインなどを全部消します。")){
      return;
    }

    localStorage.removeItem("rod_best");
    localStorage.removeItem("rod_combo");
    localStorage.removeItem("rod_coins");

    bestScore = 0;
    bestCombo = 0;
    coins = 0;

    coinHud.textContent = "🪙 0";

  });

/*
  ゲーム中に背景をタップしても何もしない。
  ターゲットだけが反応する。
*/

document.addEventListener("touchmove",(e)=>{
  if(running){
    e.preventDefault();
  }
},{passive:false});

</script>

</body>
</html>
