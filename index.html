<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RED OR DEAD 2</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050509;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:manipulation;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:600px;
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#22263d 0%,#0b0d15 45%,#030306 100%);
}

#game.fever{
  background:
    radial-gradient(circle at 50% 35%,#443414 0%,#15100a 45%,#030306 100%);
}

#game.shake{
  animation:shake .2s;
}

@keyframes shake{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-8px,4px)}
  40%{transform:translate(7px,-5px)}
  60%{transform:translate(-5px,-3px)}
  80%{transform:translate(4px,4px)}
}

#hud{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;
  padding:13px 14px;
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  align-items:center;
  pointer-events:none;
}

.stat{
  text-align:center;
}

.label{
  color:#858b9d;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
}

.value{
  font-size:20px;
  font-weight:1000;
}

#score{
  font-size:28px;
}

#combo{
  color:#ffe35a;
}

#lives{
  color:#ff4a67;
  letter-spacing:2px;
}

#arena{
  position:absolute;
  inset:75px 0 0;
  overflow:hidden;
}

.target{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translate(-50%,-50%) scale(.1);
  animation:spawn .13s ease-out forwards;
  border-radius:50%;
  font-weight:1000;
  z-index:5;
}

@keyframes spawn{
  to{transform:translate(-50%,-50%) scale(1)}
}

.target:after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.08);
}

.safe{
  background:
    radial-gradient(circle at 32% 25%,#fff 0%,#8affb1 8%,#1fdf71 45%,#08783e 100%);
  border:3px solid #baffd0;
  box-shadow:0 0 25px rgba(30,230,110,.6);
}

.gold{
  background:
    radial-gradient(circle at 30% 25%,#fff 0%,#fff49c 8%,#ffd522 42%,#a96300 100%);
  border:3px solid #fff5a8;
  box-shadow:0 0 35px rgba(255,211,25,.85);
  animation:
    spawn .13s ease-out forwards,
    goldPulse .55s infinite alternate;
}

@keyframes goldPulse{
  from{box-shadow:0 0 20px rgba(255,210,20,.5)}
  to{box-shadow:0 0 45px rgba(255,210,20,1)}
}

.bomb{
  background:
    radial-gradient(circle at 30% 25%,#ffabab 0%,#ff304e 12%,#940b24 55%,#33050d 100%);
  border:3px solid #ff7185;
  box-shadow:0 0 30px rgba(255,30,60,.8);
}

.mult{
  background:
    radial-gradient(circle at 30% 25%,#fff 0%,#dfb4ff 10%,#9d32ff 45%,#461080 100%);
  border:3px solid #dfb0ff;
  box-shadow:0 0 30px rgba(170,50,255,.75);
}

.chain{
  background:
    radial-gradient(circle at 30% 25%,#fff 0%,#b5eaff 8%,#28a9ff 45%,#07528c 100%);
  border:3px solid #a8e8ff;
  box-shadow:0 0 35px rgba(30,170,255,.8);
}

.target.hit{
  animation:hit .18s forwards!important;
}

@keyframes hit{
  to{
    transform:translate(-50%,-50%) scale(1.7);
    opacity:0;
  }
}

#event{
  position:absolute;
  z-index:22;
  top:83px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  font-weight:1000;
  letter-spacing:1px;
  color:#ffe45c;
  opacity:0;
  white-space:nowrap;
}

#event.show{
  animation:eventIn .9s forwards;
}

@keyframes eventIn{
  0%{opacity:0;transform:translateX(-50%) scale(.7)}
  20%{opacity:1;transform:translateX(-50%) scale(1.15)}
  80%{opacity:1}
  100%{opacity:0}
}

#meter{
  position:absolute;
  z-index:21;
  left:14px;
  right:14px;
  top:67px;
  height:4px;
  background:#252838;
  border-radius:20px;
  overflow:hidden;
}

#meterBar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#43ff92,#ffe34f,#ff304e);
}

.pop{
  position:absolute;
  z-index:40;
  pointer-events:none;
  font-size:23px;
  font-weight:1000;
  transform:translate(-50%,-50%);
  animation:pop .65s forwards;
}

@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  20%{opacity:1;transform:translate(-50%,-75%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}
}

.particle{
  position:absolute;
  z-index:35;
  width:7px;
  height:7px;
  border-radius:50%;
  pointer-events:none;
  animation:particle .55s forwards;
}

@keyframes particle{
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

#comboFlash{
  position:absolute;
  z-index:18;
  left:50%;
  top:38%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  text-align:center;
  opacity:0;
}

#comboFlash .big{
  font-size:clamp(40px,13vw,72px);
  font-weight:1000;
  font-style:italic;
  text-shadow:0 5px 30px #000;
}

#comboFlash .small{
  color:#ffe45c;
  font-weight:1000;
  letter-spacing:2px;
}

#coin{
  position:absolute;
  z-index:20;
  right:12px;
  bottom:10px;
  font-size:12px;
  font-weight:900;
  color:#ffd94d;
  pointer-events:none;
}

/* screens */

.screen{
  position:absolute;
  inset:0;
  z-index:60;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,30,55,.2),transparent 36%),
    rgba(3,4,8,.95);
}

.hidden{
  display:none!important;
}

.logo{
  font-size:clamp(43px,14vw,78px);
  line-height:.82;
  font-weight:1000;
  letter-spacing:-4px;
}

.logo span{
  color:#ff304d;
}

.tag{
  margin-top:18px;
  color:#a9afc0;
  font-size:13px;
}

.rule{
  margin-top:22px;
  width:min(350px,92%);
  padding:15px;
  background:#10131b;
  border:1px solid #292d3c;
  border-radius:17px;
  font-size:13px;
  line-height:1.8;
}

.green{color:#69ff9d}
.red{color:#ff4e68}
.goldText{color:#ffe34f}
.purple{color:#c874ff}
.blue{color:#50c6ff}

.mainBtn{
  margin-top:22px;
  width:min(340px,92%);
  padding:17px;
  border:0;
  border-radius:16px;
  color:#fff;
  background:linear-gradient(135deg,#ff304d,#b90026);
  box-shadow:0 10px 35px rgba(255,30,60,.3);
  font-size:19px;
  font-weight:1000;
}

.mainBtn:active{
  transform:scale(.96);
}

.subBtn{
  margin-top:10px;
  padding:11px 22px;
  border:1px solid #303444;
  border-radius:12px;
  background:#151821;
  color:#adb3c5;
  font-weight:800;
}

#overTitle{
  color:#ff415c;
  font-size:15px;
  letter-spacing:2px;
  font-weight:1000;
}

#finalScore{
  margin-top:3px;
  font-size:68px;
  line-height:1;
  font-weight:1000;
}

.result{
  margin-top:8px;
  color:#aeb4c5;
  font-size:13px;
  line-height:1.8;
}

#record{
  margin-top:9px;
  color:#ffe34f;
  font-weight:1000;
}

#mission{
  margin-top:17px;
  width:min(340px,92%);
  padding:12px;
  background:#10131b;
  border-radius:13px;
  border:1px solid #282d3c;
  color:#aeb4c5;
  font-size:12px;
}

#mission b{
  color:#fff;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="stat">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="stat">
      <div class="label">COMBO</div>
      <div class="value" id="combo">x1</div>
    </div>

    <div class="stat">
      <div class="label">LIFE</div>
      <div class="value" id="lives">♥♥♥</div>
    </div>

  </div>

  <div id="meter">
    <div id="meterBar"></div>
  </div>

  <div id="event"></div>

  <div id="arena"></div>

  <div id="comboFlash">
    <div class="big"></div>
    <div class="small"></div>
  </div>

  <div id="coin">🪙 0</div>

  <!-- TITLE -->

  <div id="start" class="screen">

    <div class="logo">
      RED<br><span>OR DEAD</span>
    </div>

    <div class="tag">
      TAKE THE RISK. BREAK THE RECORD.
    </div>

    <div class="rule">
      <span class="green">🟢 SAFE</span> → 押す<br>
      <span class="goldText">🟡 GOLD</span> → 押す。超高得点<br>
      <span class="purple">🟣 ×2</span> → 次の得点2倍<br>
      <span class="blue">🔵 CHAIN</span> → ターゲット大量出現<br>
      <span class="red">🔴 BOMB</span> → 絶対押さない<br>
      <br>
      <b>コンボが上がるほど危険になる。</b>
    </div>

    <button class="mainBtn" id="startBtn">
      PLAY
    </button>

    <button class="subBtn" id="resetBtn">
      データリセット
    </button>

  </div>

  <!-- GAME OVER -->

  <div id="over" class="screen hidden">

    <div id="overTitle">GAME OVER</div>

    <div id="finalScore">0</div>

    <div class="result">
      BEST SCORE　<b id="best">0</b><br>
      MAX COMBO　<b id="maxCombo">0</b>
    </div>

    <div id="record" class="hidden">
      🏆 NEW RECORD
    </div>

    <div id="mission">
      今日のミッション：<b id="missionText"></b>
    </div>

    <button class="mainBtn" id="retry">
      AGAIN
    </button>

    <button class="subBtn" id="titleBtn">
      TITLE
    </button>

  </div>

</div>

<script>

/* =========================
   DATA
========================= */

const arena = document.getElementById("arena");
const game = document.getElementById("game");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const livesEl = document.getElementById("lives");

const coinEl = document.getElementById("coin");
const meterBar = document.getElementById("meterBar");
const eventEl = document.getElementById("event");

const comboFlash = document.getElementById("comboFlash");

const startScreen = document.getElementById("start");
const overScreen = document.getElementById("over");

const finalScore = document.getElementById("finalScore");
const bestEl = document.getElementById("best");
const maxComboEl = document.getElementById("maxCombo");
const recordEl = document.getElementById("record");

let score = 0;
let combo = 0;
let maxCombo = 0;
let lives = 3;

let level = 0;
let elapsed = 0;
let multiplier = 1;

let running = false;
let spawnTimer = null;
let clockTimer = null;

let coins = Number(localStorage.getItem("rod2_coins") || 0);
let bestScore = Number(localStorage.getItem("rod2_best") || 0);
let bestCombo = Number(localStorage.getItem("rod2_combo") || 0);

let fever = false;
let feverTime = 0;

coinEl.textContent = "🪙 " + coins;


/* =========================
   AUDIO
========================= */

let audio = null;

function beep(freq,duration=.07,type="sine",volume=.035){

  try{

    if(!audio){
      audio = new (window.AudioContext || window.webkitAudioContext)();
    }

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume,audio.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime + duration);

  }catch(e){}

}


/* =========================
   START
========================= */

function startGame(){

  startScreen.classList.add("hidden");
  overScreen.classList.add("hidden");

  arena.innerHTML = "";

  score = 0;
  combo = 0;
  maxCombo = 0;
  lives = 3;

  level = 0;
  elapsed = 0;
  multiplier = 1;

  fever = false;
  feverTime = 0;

  game.classList.remove("fever");

  running = true;

  updateHUD();

  spawn();

  clearInterval(spawnTimer);
  clearInterval(clockTimer);

  spawnTimer = setInterval(()=>{
    if(running) spawn();
  },spawnRate());

  clockTimer = setInterval(tick,1000);

  beep(500,.08);
  setTimeout(()=>beep(800,.1),80);
}


/* =========================
   CLOCK
========================= */

function tick(){

  if(!running)return;

  elapsed++;

  level = Math.floor(elapsed / 8);

  if(fever){

    feverTime--;

    if(feverTime <= 0){
      fever = false;
      game.classList.remove("fever");
    }

  }

  meterBar.style.width =
    ((elapsed % 30) / 30 * 100) + "%";

  /*
    タイマーを更新して速度を変える
  */

  clearInterval(spawnTimer);

  spawnTimer = setInterval(()=>{
    if(running) spawn();
  },spawnRate());

}


/* =========================
   DIFFICULTY
========================= */

function spawnRate(){

  /*
    最初 850ms
    最終的に 230ms程度
  */

  return Math.max(
    230,
    850 -
    level * 60 -
    Math.floor(combo / 6) * 20
  );

}

function targetSize(){

  return Math.max(
    45,
    82 -
    level * 3 -
    Math.floor(combo / 7) * 2
  );

}


/* =========================
   SPAWN
========================= */

function spawn(){

  if(!running)return;

  const t = document.createElement("div");

  const size = targetSize();

  t.style.width = size + "px";
  t.style.height = size + "px";

  const rect = arena.getBoundingClientRect();

  t.style.left =
    (10 + Math.random()*(rect.width-20)) + "px";

  t.style.top =
    (45 + Math.random()*(rect.height-80)) + "px";


  /*
    危険度
  */

  const danger =
    Math.min(
      .48,
      .10 +
      level*.025 +
      combo*.004
    );

  const gold =
    Math.min(.08,.025+level*.003);

  const special =
    level >= 2 ? .07 : 0;

  const r = Math.random();

  let type = "safe";

  if(r < gold){
    type = "gold";
  }
  else if(r < gold + special){

    type =
      Math.random() < .5
      ? "mult"
      : "chain";

  }
  else if(r < gold + special + danger){
    type = "bomb";
  }

  t.className = "target " + type;

  if(type==="safe"){
    t.textContent = "✓";
  }

  if(type==="gold"){
    t.textContent = "★";
  }

  if(type==="bomb"){
    t.textContent = "☠";
  }

  if(type==="mult"){
    t.textContent = "×2";
  }

  if(type==="chain"){
    t.textContent = "⚡";
  }

  arena.appendChild(t);


  /*
    画面に残る時間
  */

  const lifetime = Math.max(
    560,
    1350 -
    level*65 -
    combo*7
  );

  const timeout = setTimeout(()=>{

    if(!t.isConnected)return;

    if(
      t.classList.contains("safe") ||
      t.classList.contains("gold") ||
      t.classList.contains("mult") ||
      t.classList.contains("chain")
    ){

      miss(t);

    }else{

      t.remove();

    }

  },lifetime);


  t.addEventListener("pointerdown",(e)=>{

    e.preventDefault();

    clearTimeout(timeout);

    if(!running)return;

    hit(t);

  });

}


/* =========================
   HIT
========================= */

function hit(t){

  if(t.classList.contains("hit"))return;

  t.classList.add("hit");

  if(t.classList.contains("bomb")){

    bomb();

  }
  else if(t.classList.contains("gold")){

    gold(t);

  }
  else if(t.classList.contains("mult")){

    multi(t);

  }
  else if(t.classList.contains("chain")){

    chain(t);

  }
  else{

    safe(t);

  }

  setTimeout(()=>{
    if(t.isConnected)t.remove();
  },200);

}


/* =========================
   SAFE
========================= */

function safe(t){

  combo++;
  maxCombo=Math.max(maxCombo,combo);

  multiplier=getMultiplier();

  const gain =
    10 *
    multiplier *
    (fever ? 2 : 1);

  score+=gain;

  coins++;

  save();

  pop(t,"+"+gain);

  particles(t,8);

  beep(
    420 + Math.min(combo,30)*18,
    .05
  );

  if(combo===5 || combo===10 || combo===20 || combo===30){

    flashCombo(
      combo+" COMBO!",
      "倍率 ×"+multiplier
    );

    beep(900,.1,"triangle");

  }

  updateHUD();

}


/* =========================
   GOLD
========================= */

function gold(t){

  combo++;
  maxCombo=Math.max(maxCombo,combo);

  multiplier=getMultiplier();

  const gain =
    100 *
    multiplier *
    (fever ? 2 : 1);

  score+=gain;

  coins+=5;

  save();

  pop(t,"+"+gain+" 🪙");

  particles(t,20);

  activateFever();

  beep(1100,.1,"triangle");
  setTimeout(()=>beep(1450,.12,"triangle"),70);

  updateHUD();

}


/* =========================
   MULT
========================= */

function multi(t){

  combo++;
  maxCombo=Math.max(maxCombo,combo);

  multiplier=Math.min(
    12,
    multiplier+2
  );

  const gain =
    20 *
    multiplier *
    (fever ? 2 : 1);

  score+=gain;

  coins+=2;

  save();

  pop(t,"×2  +"+gain);

  particles(t,14);

  flashCombo(
    "POWER UP",
    "倍率 ×"+multiplier
  );

  beep(700,.08,"square");
  beep(1000,.1,"triangle");

  updateHUD();

}


/* =========================
   CHAIN
========================= */

function chain(t){

  combo++;
  maxCombo=Math.max(maxCombo,combo);

  multiplier=getMultiplier();

  const gain =
    30 *
    multiplier *
    (fever ? 2 : 1);

  score+=gain;
  coins+=3;

  save();

  pop(t,"CHAIN!");

  particles(t,20);

  flashCombo(
    "CHAIN!",
    "ターゲット大量出現"
  );

  beep(600,.08,"triangle");
  beep(900,.08,"triangle");

  /*
    一気に追加
  */

  for(let i=0;i<5;i++){

    setTimeout(()=>{
      if(running)spawn();
    },i*90);

  }

  updateHUD();

}


/* =========================
   BOMB
========================= */

function bomb(){

  lives--;

  combo=0;
  multiplier=1;

  game.classList.remove("shake");

  void game.offsetWidth;

  game.classList.add("shake");

  beep(80,.25,"sawtooth",.06);

  if(navigator.vibrate){
    navigator.vibrate([80,50,120]);
  }

  flashCombo(
    "💥 BOMB!",
    "コンボ消滅"
  );

  updateHUD();

  if(lives<=0){
    endGame();
  }

}


/* =========================
   MISS
========================= */

function miss(t){

  t.remove();

  lives--;

  combo=0;
  multiplier=1;

  popAt(
    t,
    "MISS!"
  );

  beep(120,.15,"square");

  updateHUD();

  if(lives<=0){
    endGame();
  }

}


/* =========================
   MULTIPLIER
========================= */

function getMultiplier(){

  if(combo>=30)return 12;
  if(combo>=20)return 8;
  if(combo>=12)return 5;
  if(combo>=7)return 3;
  if(combo>=3)return 2;

  return 1;

}


/* =========================
   FEVER
========================= */

function activateFever(){

  fever=true;
  feverTime=7;

  game.classList.add("fever");

  showEvent("🔥 FEVER! SCORE ×2");

}


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreEl.textContent =
    score.toLocaleString();

  comboEl.textContent =
    "x"+multiplier;

  comboEl.style.color =
    multiplier>=5
    ? "#ffda45"
    : "#fff";

  livesEl.textContent =
    "♥".repeat(Math.max(0,lives))+
    "♡".repeat(Math.max(0,3-lives));

  coinEl.textContent =
    "🪙 "+coins;

}


/* =========================
   POPUPS
========================= */

function pop(t,text){

  const p=document.createElement("div");

  p.className="pop";
  p.textContent=text;

  p.style.left=t.style.left;
  p.style.top=t.style.top;

  p.style.color =
    text.includes("🪙")
    ? "#ffe34f"
    : "#78ffad";

  arena.appendChild(p);

  setTimeout(()=>p.remove(),700);

}


function popAt(t,text){

  const p=document.createElement("div");

  p.className="pop";
  p.textContent=text;

  p.style.left=t.style.left;
  p.style.top=t.style.top;

  p.style.color="#ff4d67";

  arena.appendChild(p);

  setTimeout(()=>p.remove(),700);

}


/* =========================
   COMBO FLASH
========================= */

let flashTimer;

function flashCombo(big,small){

  clearTimeout(flashTimer);

  comboFlash.innerHTML=`
    <div class="big">${big}</div>
    <div class="small">${small}</div>
  `;

  comboFlash.style.opacity="1";

  comboFlash.animate(
    [
      {transform:"translate(-50%,-50%) scale(.5)",opacity:0},
      {transform:"translate(-50%,-50%) scale(1.15)",opacity:1},
      {transform:"translate(-50%,-50%) scale(1)",opacity:0}
    ],
    {
      duration:700,
      easing:"ease-out"
    }
  );

  flashTimer=setTimeout(()=>{
    comboFlash.style.opacity="0";
  },700);

}


/* =========================
   EVENT
========================= */

function showEvent(text){

  eventEl.textContent=text;

  eventEl.classList.remove("show");

  void eventEl.offsetWidth;

  eventEl.classList.add("show");

}


/* =========================
   PARTICLES
========================= */

function particles(t,count){

  const x=parseFloat(t.style.left);
  const y=parseFloat(t.style.top);

  for(let i=0;i<count;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=x+"px";
    p.style.top=y+"px";

    const a=Math.random()*Math.PI*2;
    const d=30+Math.random()*80;

    p.style.setProperty(
      "--x",
      Math.cos(a)*d+"px"
    );

    p.style.setProperty(
      "--y",
      Math.sin(a)*d+"px"
    );

    arena.appendChild(p);

    setTimeout(()=>p.remove(),600);

  }

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "rod2_coins",
    coins
  );

  if(score>bestScore){

    bestScore=score;

    localStorage.setItem(
      "rod2_best",
      bestScore
    );

  }

  if(maxCombo>bestCombo){

    bestCombo=maxCombo;

    localStorage.setItem(
      "rod2_combo",
      bestCombo
    );

  }

}


/* =========================
   GAME OVER
========================= */

function endGame(){

  running=false;

  clearInterval(spawnTimer);
  clearInterval(clockTimer);

  arena.innerHTML="";

  const isRecord =
    score>Number(localStorage.getItem("rod2_best_before")||0);

  const previousBest =
    Number(localStorage.getItem("rod2_best_before")||0);

  if(score>bestScore){

    bestScore=score;

    localStorage.setItem(
      "rod2_best",
      bestScore
    );

  }

  if(maxCombo>bestCombo){

    bestCombo=maxCombo;

    localStorage.setItem(
      "rod2_combo",
      bestCombo
    );

  }

  localStorage.setItem(
    "rod2_best_before",
    bestScore
  );

  finalScore.textContent =
    score.toLocaleString();

  bestEl.textContent =
    bestScore.toLocaleString();

  maxComboEl.textContent =
    bestCombo;

  /*
    初回プレイで0から記録更新扱いにならないようにする
  */

  recordEl.classList.toggle(
    "hidden",
    !(score>previousBest && previousBest>0)
  );

  document.getElementById("missionText").textContent =
    getMissionText();

  overScreen.classList.remove("hidden");

}


/* =========================
   MISSIONS
========================= */

function getMissionText(){

  if(maxCombo>=20){
    return "20 COMBO達成！";
  }

  if(score>=5000){
    return "5,000点突破！";
  }

  if(score>=2000){
    return "2,000点突破！";
  }

  if(coins>=20){
    return "コイン20枚以上獲得！";
  }

  return "次は1,000点を目指せ！";

}


/* =========================
   BUTTONS
========================= */

document.getElementById("startBtn")
  .addEventListener("click",startGame);

document.getElementById("retry")
  .addEventListener("click",startGame);

document.getElementById("titleBtn")
  .addEventListener("click",()=>{

    overScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");

  });


document.getElementById("resetBtn")
  .addEventListener("click",()=>{

    if(!confirm("スコア・コイン・記録を全部消します。")){
      return;
    }

    localStorage.removeItem("rod2_coins");
    localStorage.removeItem("rod2_best");
    localStorage.removeItem("rod2_combo");
    localStorage.removeItem("rod2_best_before");

    coins=0;
    bestScore=0;
    bestCombo=0;

    coinEl.textContent="🪙 0";

  });


/*
  iPhoneで長押し・スクロール等を防止
*/

document.addEventListener(
  "touchmove",
  e=>{
    if(running)e.preventDefault();
  },
  {passive:false}
);

</script>
