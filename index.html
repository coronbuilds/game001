<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RED OR DEAD 2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#gameWrap{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(100vh,177.77vw);

    max-width:540px;
    max-height:960px;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    background:#6ac8ff;
}

/* =====================
   UI
===================== */

#hud{

    position:absolute;

    left:10px;
    right:10px;
    top:10px;

    height:100px;

    border-radius:14px;

    background:rgba(0,0,0,.45);

    color:white;

    padding:10px;
}

#title{

    font-size:22px;
    font-weight:bold;

}

#score{

    margin-top:6px;

    font-size:18px;

}

#stage{

    margin-top:4px;

    font-size:16px;

}

#reloadBar{

    margin-top:8px;

    width:100%;
    height:10px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

#reloadFill{

    width:0%;
    height:100%;

    background:#ffd600;
}

#hpBar{

    margin-top:8px;

    width:100%;
    height:14px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

#hpFill{

    width:100%;
    height:100%;

    background:#ff3d3d;
}

/* =====================
   スマホ操作
===================== */

.controls{

    position:absolute;

    left:0;
    right:0;
    bottom:20px;

    display:flex;

    justify-content:space-between;

    padding:0 15px;

    pointer-events:none;
}

.leftPad,
.rightPad{

    display:flex;
    gap:10px;

    pointer-events:auto;
}

.btn{

    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.7);

    background:rgba(0,0,0,.5);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:26px;
    font-weight:bold;
}

.btn:active{

    transform:scale(.93);

}

#shootBtn{

    width:88px;
    height:88px;

    background:rgba(200,0,0,.75);
}

#dashBtn{

    background:rgba(255,170,0,.75);
}

#startScreen{

    position:absolute;

    inset:0;

    background:
    rgba(0,0,0,.72);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:white;
}

#startScreen h1{

    font-size:52px;
    margin-bottom:10px;
}

#startScreen p{

    margin-bottom:25px;
}

#startBtn{

    border:0;

    padding:16px 35px;

    border-radius:12px;

    font-size:22px;

    font-weight:bold;
}

</style>
</head>

<body>

<div id="gameWrap">

<canvas
id="game"
width="540"
height="960">
</canvas>

<div id="hud">

    <div id="title">
        RED OR DEAD 2
    </div>

    <div id="score">
        SCORE : 0
    </div>

    <div id="stage">
        STAGE : 1
    </div>

    <div id="reloadBar">
        <div id="reloadFill"></div>
    </div>

    <div id="hpBar">
        <div id="hpFill"></div>
    </div>

</div>

<div id="startScreen">

    <h1>RED OR DEAD 2</h1>

    <p>
        Vertical Edition
    </p>

    <button id="startBtn">
        START
    </button>

</div>

<div class="controls">

    <div class="leftPad">

        <div
        class="btn"
        id="leftBtn">
            ◀
        </div>

        <div
        class="btn"
        id="rightBtn">
            ▶
        </div>

    </div>

    <div class="rightPad">

        <div
        class="btn"
        id="jumpBtn">
            ▲
        </div>

        <div
        class="btn"
        id="dashBtn">
            ⚡
        </div>

        <div
        class="btn"
        id="shootBtn">
            🔥
        </div>

    </div>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* =====================
   ゲーム状態
===================== */

let gameStarted=false;

let score=0;

let stage=1;

let coins=0;

let combo=0;

let kills=0;

let gameTime=0;

/* =====================
   入力
===================== */

const keys={};

document.addEventListener(
"keydown",
e=>{

keys[
e.key.toLowerCase()
]=true;

});

document.addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
]=false;

});

function holdButton(
id,
key
){

const btn=
document.getElementById(id);

btn.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

keys[key]=true;

}
);

btn.addEventListener(
"pointerup",
()=>{

keys[key]=false;

}
);

btn.addEventListener(
"pointerleave",
()=>{

keys[key]=false;

}
);

btn.addEventListener(
"pointercancel",
()=>{

keys[key]=false;

}
);

}

holdButton(
"leftBtn",
"arrowleft"
);

holdButton(
"rightBtn",
"arrowright"
);

holdButton(
"shootBtn",
"x"
);

holdButton(
"dashBtn",
"shift"
);

/* Part1-Bへ続く */
/* =========================
   PLAYER
========================= */

const groundY = 835;

const player = {

    x:80,
    y:groundY-70,

    w:46,
    h:70,

    vx:0,
    vy:0,

    speed:5.5,
    jumpPower:-15,
    gravity:0.75,

    hp:5,
    maxHp:5,

    ammo:30,
    maxAmmo:30,

    reloadTime:0,
    reloadDuration:90,

    shootCooldown:0,
    fireRate:8,

    dashCooldown:0,
    dashDuration:0,

    invincible:0,

    onGround:false

};


/* =========================
   OBJECTS
========================= */

let bullets=[];
let enemyBullets=[];
let enemies=[];
let particles=[];
let coinsObj=[];


/* =========================
   ENEMY
========================= */

let spawnTimer=60;

function spawnEnemy(){

    const type=Math.random();

    let enemy;

    if(type<0.65){

        enemy={

            type:"normal",

            x:W+50,
            y:groundY-55,

            w:42,
            h:55,

            hp:2,
            maxHp:2,

            speed:2.5,

            shootTimer:
                80+Math.random()*100

        };

    }

    else if(type<0.85){

        enemy={

            type:"fast",

            x:W+50,
            y:groundY-45,

            w:34,
            h:45,

            hp:1,
            maxHp:1,

            speed:4.8,

            shootTimer:
                100+Math.random()*80

        };

    }

    else{

        enemy={

            type:"tank",

            x:W+50,
            y:groundY-80,

            w:58,
            h:80,

            hp:6,
            maxHp:6,

            speed:1.2,

            shootTimer:
                60+Math.random()*80

        };

    }

    enemies.push(enemy);

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!gameStarted) return;

    if(player.reloadTime>0) return;

    if(player.shootCooldown>0) return;

    if(player.ammo<=0){

        startReload();

        return;

    }

    bullets.push({

        x:player.x+player.w,

        y:player.y+27,

        w:20,

        h:6,

        speed:13,

        damage:1

    });

    player.ammo--;

    player.shootCooldown=
        player.fireRate;

    if(player.ammo<=0){

        startReload();

    }

}


/* =========================
   RELOAD
========================= */

function startReload(){

    if(player.reloadTime>0) return;

    if(player.ammo===player.maxAmmo)
        return;

    player.reloadTime=
        player.reloadDuration;

}


/* =========================
   DASH
========================= */

function dash(){

    if(
        !gameStarted ||
        player.dashCooldown>0 ||
        player.dashDuration>0
    ){
        return;
    }

    player.dashDuration=15;

    player.dashCooldown=180;

    player.invincible=20;

    player.vx=10;

}


/* =========================
   JUMP
========================= */

function jump(){

    if(
        player.onGround &&
        gameStarted
    ){

        player.vy=
            player.jumpPower;

        player.onGround=false;

    }

}


/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(enemy){

    enemyBullets.push({

        x:enemy.x,

        y:enemy.y+enemy.h/2,

        w:14,

        h:7,

        speed:-6,

        damage:1

    });

}


/* =========================
   PARTICLE
========================= */

function explosion(
    x,
    y,
    count=12
){

    for(let i=0;i<count;i++){

        const angle=
            Math.random()*Math.PI*2;

        const speed=
            1+Math.random()*5;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            life:
                20+Math.random()*30,

            size:
                2+Math.random()*5

        });

    }

}


/* =========================
   COIN
========================= */

function spawnCoin(x,y){

    coinsObj.push({

        x:x,
        y:y,

        r:10,

        speed:2

    });

}


/* =========================
   COLLISION
========================= */

function rectHit(a,b){

    return(

        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y

    );

}


/* =========================
   DAMAGE PLAYER
========================= */

function damagePlayer(){

    if(player.invincible>0)
        return;

    player.hp--;

    player.invincible=70;

    combo=0;

    explosion(
        player.x+player.w/2,
        player.y+player.h/2,
        25
    );

    if(player.hp<=0){

        gameStarted=false;

        alert(
            "GAME OVER\nSCORE : "+score
        );

    }

}


/* =========================
   KILL ENEMY
========================= */

function killEnemy(enemy){

    const index=
        enemies.indexOf(enemy);

    if(index>=0){

        enemies.splice(
            index,
            1
        );

    }

    kills++;

    combo++;

    score+=
        100+
        combo*10;

    if(Math.random()<0.3){

        spawnCoin(
            enemy.x,
            enemy.y
        );

    }

    explosion(
        enemy.x+enemy.w/2,
        enemy.y+enemy.h/2,
        20
    );

}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(){

    player.vx=0;

    if(keys["arrowleft"]){

        player.vx=
            -player.speed;

    }

    if(keys["arrowright"]){

        player.vx=
            player.speed;

    }

    if(keys["arrowup"]){

        keys["arrowup"]=false;

        jump();

    }

    if(keys["z"]){

        keys["z"]=false;

        jump();

    }

    if(keys["shift"]){

        keys["shift"]=false;

        dash();

    }

    if(keys["x"]){

        shoot();

    }


    /* DASH */

    if(player.dashDuration>0){

        player.dashDuration--;

        player.vx=12;

    }

    if(player.dashCooldown>0){

        player.dashCooldown--;

    }


    /* MOVE */

    player.x+=player.vx;

    player.x=Math.max(
        10,
        Math.min(
            W-player.w-10,
            player.x
        )
    );


    /* GRAVITY */

    player.vy+=
        player.gravity;

    player.y+=
        player.vy;


    /* GROUND */

    if(
        player.y+player.h>=groundY
    ){

        player.y=
            groundY-player.h;

        player.vy=0;

        player.onGround=true;

    }
    else{

        player.onGround=false;

    }


    /* INVINCIBLE */

    if(player.invincible>0){

        player.invincible--;

    }


    /* SHOOT COOLDOWN */

    if(player.shootCooldown>0){

        player.shootCooldown--;

    }


    /* RELOAD */

    if(player.reloadTime>0){

        player.reloadTime--;

        if(
            player.reloadTime===0
        ){

            player.ammo=
                player.maxAmmo;

        }

    }

}


/* =========================
   UPDATE BULLETS
========================= */

function updateBullets(){

    bullets.forEach(
        bullet=>{

            bullet.x+=
                bullet.speed;

        }
    );

    bullets=
        bullets.filter(
            b=>b.x<W+100
        );

}


/* =========================
   UPDATE ENEMY BULLETS
========================= */

function updateEnemyBullets(){

    enemyBullets.forEach(
        bullet=>{

            bullet.x+=
                bullet.speed;

        }
    );

    for(
        let i=
        enemyBullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            enemyBullets[i];

        if(
            rectHit(
                bullet,
                player
            )
        ){

            enemyBullets.splice(
                i,
                1
            );

            damagePlayer();

        }

    }

    enemyBullets=
        enemyBullets.filter(
            b=>b.x>-50
        );

}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies(){

    spawnTimer--;

    if(
        spawnTimer<=0 &&
        enemies.length<8
    ){

        spawnEnemy();

        spawnTimer=
            Math.max(
                25,
                75-stage*5
            );

    }


    enemies.forEach(
        enemy=>{

            enemy.x-=
                enemy.speed;

            enemy.shootTimer--;

            if(
                enemy.shootTimer<=0 &&
                enemy.x<W-50
            ){

                enemyShoot(enemy);

                enemy.shootTimer=
                    100+
                    Math.random()*100;

            }

        }
    );


    /* PLAYER HIT */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=
            enemies[i];

        if(
            rectHit(
                player,
                enemy
            )
        ){

            enemies.splice(
                i,
                1
            );

            damagePlayer();

            continue;

        }

        if(
            enemy.x< -100
        ){

            enemies.splice(
                i,
                1
            );

        }

    }


    /* BULLET HIT */

    for(
        let bi=bullets.length-1;
        bi>=0;
        bi--
    ){

        const bullet=
            bullets[bi];

        let hit=false;

        for(
            let ei=enemies.length-1;
            ei>=0;
            ei--
        ){

            const enemy=
                enemies[ei];

            if(
                rectHit(
                    bullet,
                    enemy
                )
            ){

                enemy.hp-=
                    bullet.damage;

                bullets.splice(
                    bi,
                    1
                );

                explosion(
                    bullet.x,
                    bullet.y,
                    6
                );

                hit=true;

                if(enemy.hp<=0){

                    killEnemy(
                        enemy
                    );

                }

                break;

            }

        }

        if(hit) continue;

    }

}


/* =========================
   UPDATE COINS
========================= */

function updateCoins(){

    coinsObj.forEach(
        coin=>{

            coin.x-=
                coin.speed;

        }
    );


    for(
        let i=coinsObj.length-1;
        i>=0;
        i--
    ){

        const coin=
            coinsObj[i];

        const box={

            x:
                coin.x-coin.r,

            y:
                coin.y-coin.r,

            w:
                coin.r*2,

            h:
                coin.r*2

        };

        if(
            rectHit(
                player,
                box
            )
        ){

            coins++;

            score+=50;

            coinsObj.splice(
                i,
                1
            );

        }

    }


    coinsObj=
        coinsObj.filter(
            c=>c.x>-50
        );

}


/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles(){

    particles.forEach(
        p=>{

            p.x+=p.vx;

            p.y+=p.vy;

            p.vy+=.12;

            p.life--;

        }
    );

    particles=
        particles.filter(
            p=>p.life>0
        );

}


/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!gameStarted){

        updateParticles();

        return;

    }

    gameTime++;

    updatePlayer();

    updateBullets();

    updateEnemyBullets();

    updateEnemies();

    updateCoins();

    updateParticles();

}


/* =========================
   START
========================= */

document
.getElementById("startBtn")
.addEventListener(
"click",
()=>{

    gameStarted=true;

    document
    .getElementById(
        "startScreen"
    )
    .style.display="none";

    player.hp=
        player.maxHp;

    player.ammo=
        player.maxAmmo;

    player.reloadTime=0;

    player.x=80;

    player.y=
        groundY-player.h;

}
);


/* Part1-Cへ続く */
/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

    /* SKY */

    const sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(
        0,
        "#55bdf5"
    );

    sky.addColorStop(
        .65,
        "#b9ecff"
    );

    sky.addColorStop(
        1,
        "#e7f8ff"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SUN */

    ctx.fillStyle=
        "rgba(255,240,150,.8)";

    ctx.beginPath();

    ctx.arc(
        W-80,
        125,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CLOUDS */

    ctx.fillStyle=
        "rgba(255,255,255,.75)";

    drawCloud(
        80,
        180,
        1
    );

    drawCloud(
        360,
        250,
        .8
    );

    drawCloud(
        180,
        100,
        .6
    );


    /* FAR MOUNTAINS */

    ctx.fillStyle="#79a9a0";

    ctx.beginPath();

    ctx.moveTo(0,600);

    ctx.lineTo(90,500);
    ctx.lineTo(180,585);
    ctx.lineTo(270,470);
    ctx.lineTo(370,580);
    ctx.lineTo(455,490);
    ctx.lineTo(540,575);

    ctx.lineTo(540,835);
    ctx.lineTo(0,835);

    ctx.closePath();

    ctx.fill();


    /* GROUND */

    ctx.fillStyle="#4f9b48";

    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    /* ROAD */

    ctx.fillStyle="#765438";

    ctx.fillRect(
        0,
        groundY-12,
        W,
        12
    );


    /* GRASS */

    ctx.fillStyle="#77bd55";

    for(
        let x=0;
        x<W;
        x+=35
    ){

        ctx.fillRect(
            x,
            groundY+5,
            18,
            5
        );

    }

}


/* =========================
   CLOUD
========================= */

function drawCloud(
    x,
    y,
    scale
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        28,
        0,
        Math.PI*2
    );

    ctx.arc(
        30,
        -12,
        35,
        0,
        Math.PI*2
    );

    ctx.arc(
        65,
        0,
        27,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    if(
        player.invincible>0 &&
        Math.floor(
            player.invincible/5
        )%2===0
    ){

        return;

    }


    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    /* BODY */

    ctx.fillStyle="#1976d2";

    ctx.fillRect(
        7,
        20,
        32,
        42
    );


    /* HEAD */

    ctx.fillStyle="#ffd2a6";

    ctx.beginPath();

    ctx.arc(
        23,
        14,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* HAIR */

    ctx.fillStyle="#222";

    ctx.fillRect(
        9,
        2,
        28,
        9
    );


    /* EYE */

    ctx.fillStyle="#111";

    ctx.fillRect(
        28,
        12,
        4,
        4
    );


    /* GUN */

    ctx.fillStyle="#222";

    ctx.fillRect(
        32,
        30,
        25,
        8
    );

    ctx.fillStyle="#555";

    ctx.fillRect(
        50,
        32,
        12,
        4
    );


    /* LEGS */

    ctx.fillStyle="#173d70";

    ctx.fillRect(
        9,
        60,
        11,
        10
    );

    ctx.fillRect(
        27,
        60,
        11,
        10
    );


    ctx.restore();

}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies(){

    enemies.forEach(
        enemy=>{

            ctx.save();

            ctx.translate(
                enemy.x,
                enemy.y
            );


            if(
                enemy.type==="normal"
            ){

                /* BODY */

                ctx.fillStyle=
                    "#d62828";

                ctx.fillRect(
                    5,
                    12,
                    enemy.w-10,
                    enemy.h-12
                );


                /* HEAD */

                ctx.fillStyle=
                    "#ffb28f";

                ctx.beginPath();

                ctx.arc(
                    enemy.w/2,
                    10,
                    13,
                    0,
                    Math.PI*2
                );

                ctx.fill();


                /* EYES */

                ctx.fillStyle="#111";

                ctx.fillRect(
                    13,
                    7,
                    4,
                    4
                );

                ctx.fillRect(
                    25,
                    7,
                    4,
                    4
                );

            }


            else if(
                enemy.type==="fast"
            ){

                ctx.fillStyle=
                    "#7b1fa2";

                ctx.fillRect(
                    3,
                    5,
                    enemy.w-6,
                    enemy.h-5
                );

                ctx.fillStyle="#ffccbc";

                ctx.fillRect(
                    8,
                    0,
                    enemy.w-16,
                    13
                );

            }


            else{

                ctx.fillStyle=
                    "#37474f";

                ctx.fillRect(
                    0,
                    10,
                    enemy.w,
                    enemy.h-10
                );

                ctx.fillStyle="#90a4ae";

                ctx.fillRect(
                    8,
                    0,
                    enemy.w-16,
                    22
                );

                ctx.fillStyle="#f44336";

                ctx.fillRect(
                    15,
                    7,
                    8,
                    5
                );

                ctx.fillRect(
                    35,
                    7,
                    8,
                    5
                );

            }


            /* HP BAR */

            const hpRate=
                enemy.hp/
                enemy.maxHp;

            ctx.fillStyle="#222";

            ctx.fillRect(
                0,
                -10,
                enemy.w,
                5
            );

            ctx.fillStyle="#4caf50";

            ctx.fillRect(
                0,
                -10,
                enemy.w*hpRate,
                5
            );


            ctx.restore();

        }
    );

}


/* =========================
   DRAW BULLETS
========================= */

function drawBullets(){

    bullets.forEach(
        bullet=>{

            ctx.fillStyle="#ffe600";

            ctx.fillRect(
                bullet.x,
                bullet.y,
                bullet.w,
                bullet.h
            );

            ctx.fillStyle="#fff";

            ctx.fillRect(
                bullet.x+2,
                bullet.y+1,
                8,
                2
            );

        }
    );


    enemyBullets.forEach(
        bullet=>{

            ctx.fillStyle="#ff1744";

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y+3,
                7,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* =========================
   DRAW COINS
========================= */

function drawCoins(){

    coinsObj.forEach(
        coin=>{

            ctx.fillStyle="#ffd600";

            ctx.beginPath();

            ctx.arc(
                coin.x,
                coin.y,
                coin.r,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#fff176";

            ctx.beginPath();

            ctx.arc(
                coin.x-3,
                coin.y-3,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles(){

    particles.forEach(
        p=>{

            ctx.globalAlpha=
                Math.max(
                    0,
                    p.life/40
                );

            ctx.fillStyle="#ff9800";

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );

        }
    );

    ctx.globalAlpha=1;

}


/* =========================
   DRAW UI
========================= */

function updateHUD(){

    document
    .getElementById(
        "score"
    )
    .textContent=
        "SCORE : "+score+
        "   COINS : "+coins+
        "   COMBO : "+combo;

    document
    .getElementById(
        "stage"
    )
    .textContent=
        "STAGE : "+stage+
        "   AMMO : "+
        player.ammo+
        "/"+
        player.maxAmmo;


    const hpRate=
        Math.max(
            0,
            player.hp/
            player.maxHp
        )*100;

    document
    .getElementById(
        "hpFill"
    )
    .style.width=
        hpRate+"%";


    let reloadRate=0;

    if(
        player.reloadTime>0
    ){

        reloadRate=
            (
                1-
                player.reloadTime/
                player.reloadDuration
            )*100;

    }

    document
    .getElementById(
        "reloadFill"
    )
    .style.width=
        reloadRate+"%";

}


/* =========================
   STAGE PROGRESS
========================= */

let stageTimer=0;

function updateStage(){

    stageTimer++;

    if(
        stageTimer>=1800
    ){

        stage++;

        stageTimer=0;

        score+=1000;

        /* 少しだけ敵を強くする */

        enemies.forEach(
            enemy=>{

                enemy.speed+=
                    .15;

            }
        );

    }

}


/* =========================
   SAVE
========================= */

function saveGame(){

    const saveData={

        score:score,

        stage:stage,

        coins:coins,

        kills:kills

    };

    localStorage.setItem(
        "red_or_dead_2_save",
        JSON.stringify(
            saveData
        )
    );

}


/* =========================
   LOAD
========================= */

function loadGame(){

    const data=
        localStorage.getItem(
            "red_or_dead_2_save"
        );

    if(!data) return;

    try{

        const saveData=
            JSON.parse(data);

        score=
            saveData.score||0;

        stage=
            saveData.stage||1;

        coins=
            saveData.coins||0;

        kills=
            saveData.kills||0;

    }
    catch(e){

        console.log(
            "Save data error"
        );

    }

}


/* =========================
   AUTO SAVE
========================= */

setInterval(
    ()=>{

        if(gameStarted){

            saveGame();

        }

    },
    5000
);


/* =========================
   DRAW
========================= */

function draw(){

    drawBackground();

    drawCoins();

    drawEnemies();

    drawBullets();

    drawPlayer();

    drawParticles();

    updateHUD();


    /* DASH EFFECT */

    if(
        player.dashDuration>0
    ){

        ctx.fillStyle=
            "rgba(255,255,255,.18)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    /* RELOAD TEXT */

    if(
        player.reloadTime>0
    ){

        ctx.fillStyle="#fff";

        ctx.font=
            "bold 24px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "RELOADING...",
            W/2,
            145
        );

        ctx.textAlign="left";

    }

}


/* =========================
   MAIN LOOP
========================= */

function loop(){

    update();

    if(gameStarted){

        updateStage();

    }

    draw();

    requestAnimationFrame(
        loop
    );

}


/* =========================
   EXTRA KEYBOARD CONTROLS
========================= */

document.addEventListener(
"keydown",
e=>{

    const key=
        e.key.toLowerCase();

    if(key==="c"){

        dash();

    }

    if(key===" "){

        e.preventDefault();

        jump();

    }

    if(key==="r"){

        startReload();

    }

});


/* =========================
   TOUCH JUMP
========================= */

document
.getElementById(
    "jumpBtn"
)
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        jump();

    }
);


/* =========================
   DOUBLE TAP PREVENTION
========================= */

document.addEventListener(
"touchmove",
e=>{

    e.preventDefault();

},
{
    passive:false
});


/* =========================
   LOAD + START LOOP
========================= */

loadGame();

loop();
