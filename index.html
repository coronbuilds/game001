<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反射神経ゲーム</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #111;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
}
.container {
  width: 100%;
  max-width: 500px;
  text-align: center;
  padding: 20px;
}
h1 {
  font-size: 32px;
  margin-bottom: 5px;
}
#message {
  font-size: 20px;
  margin: 15px 0;
}
#game {
  width: 100%;
  height: 350px;
  border-radius: 20px;
  background: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
  font-weight: bold;
  touch-action: manipulation;
}
button {
  margin-top: 20px;
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 12px;
}
#result {
  margin-top: 20px;
  font-size: 22px;
}
#best {
  margin-top: 10px;
  font-size: 18px;
}
</style>
</head>
<body>
<div class="container">
<h1>⚡ 反射神経ゲーム</h1>
<div id="message">
「スタート」を押してね
</div>
<div id="game">
待機中
</div>
<button onclick="startGame()">
スタート
</button>
<div id="result"></div>
<div id="best">
🏆 最高記録：<span id="bestScore">---</span>
</div>
</div>
<script>
let startTime;
let timer;
let waiting = false;
let playing = false;
// スマホ内に保存されている最高記録を取得
let bestScore = localStorage.getItem("reactionBest");
document.getElementById("bestScore").textContent =
  bestScore ? bestScore + " ms" : "---";
function startGame() {
  if (playing) return;
  playing = true;
  waiting = true;
  document.getElementById("result").textContent = "";
  document.getElementById("message").textContent =
    "まだ押さないで！";
  document.getElementById("game").textContent =
    "待って…";
  document.getElementById("game").style.background =
    "#333";
  const delay =
    Math.floor(Math.random() * 3000) + 2000;
  timer = setTimeout(() => {
    waiting = false;
    startTime = performance.now();
    document.getElementById("game").textContent =
      "TAP!";
    document.getElementById("game").style.background =
      "#00aa55";
    document.getElementById("message").textContent =
      "今だ！";
  }, delay);
}
document.getElementById("game").addEventListener("click", () => {
  if (!playing) return;
  // フライング
  if (waiting) {
    clearTimeout(timer);
    document.getElementById("message").textContent =
      "フライング！😈";
    document.getElementById("game").textContent =
      "もう一回！";
    document.getElementById("game").style.background =
      "#aa2222";
    document.getElementById("result").textContent =
      "反射神経：失格";
    playing = false;
    waiting = false;
    return;
  }
  // 反応速度を計算
  const reaction =
    Math.round(performance.now() - startTime);
  document.getElementById("message").textContent =
    "ナイス！";
  document.getElementById("game").textContent =
    reaction + " ms";
  document.getElementById("game").style.background =
    "#333";
  document.getElementById("result").textContent =
    "あなたの反応速度：" + reaction + " ms";
  // 最高記録更新
  if (!bestScore || reaction < Number(bestScore)) {
    bestScore = reaction;
    localStorage.setItem(
      "reactionBest",
      bestScore
    );
    document.getElementById("bestScore").textContent =
      bestScore + " ms";
    document.getElementById("result").textContent +=
      " 🎉 新記録！";
  }
  playing = false;
});
</script>
</body>
</html>
