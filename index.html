<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RED OR DEAD 2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#gameWrap{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(100vh,177.77vw);

    max-width:540px;
    max-height:960px;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    background:#6ac8ff;
}

/* =====================
   UI
===================== */

#hud{

    position:absolute;

    left:10px;
    right:10px;
    top:10px;

    height:100px;

    border-radius:14px;

    background:rgba(0,0,0,.45);

    color:white;

    padding:10px;
}

#title{

    font-size:22px;
    font-weight:bold;

}

#score{

    margin-top:6px;

    font-size:18px;

}

#stage{

    margin-top:4px;

    font-size:16px;

}

#reloadBar{

    margin-top:8px;

    width:100%;
    height:10px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

#reloadFill{

    width:0%;
    height:100%;

    background:#ffd600;
}

#hpBar{

    margin-top:8px;

    width:100%;
    height:14px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

#hpFill{

    width:100%;
    height:100%;

    background:#ff3d3d;
}

/* =====================
   スマホ操作
===================== */

.controls{

    position:absolute;

    left:0;
    right:0;
    bottom:20px;

    display:flex;

    justify-content:space-between;

    padding:0 15px;

    pointer-events:none;
}

.leftPad,
.rightPad{

    display:flex;
    gap:10px;

    pointer-events:auto;
}

.btn{

    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.7);

    background:rgba(0,0,0,.5);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:26px;
    font-weight:bold;
}

.btn:active{

    transform:scale(.93);

}

#shootBtn{

    width:88px;
    height:88px;

    background:rgba(200,0,0,.75);
}

#dashBtn{

    background:rgba(255,170,0,.75);
}

#startScreen{

    position:absolute;

    inset:0;

    background:
    rgba(0,0,0,.72);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:white;
}

#startScreen h1{

    font-size:52px;
    margin-bottom:10px;
}

#startScreen p{

    margin-bottom:25px;
}

#startBtn{

    border:0;

    padding:16px 35px;

    border-radius:12px;

    font-size:22px;

    font-weight:bold;
}

</style>
</head>

<body>

<div id="gameWrap">

<canvas
id="game"
width="540"
height="960">
</canvas>

<div id="hud">

    <div id="title">
        RED OR DEAD 2
    </div>

    <div id="score">
        SCORE : 0
    </div>

    <div id="stage">
        STAGE : 1
    </div>

    <div id="reloadBar">
        <div id="reloadFill"></div>
    </div>

    <div id="hpBar">
        <div id="hpFill"></div>
    </div>

</div>

<div id="startScreen">

    <h1>RED OR DEAD 2</h1>

    <p>
        Vertical Edition
    </p>

    <button id="startBtn">
        START
    </button>

</div>

<div class="controls">

    <div class="leftPad">

        <div
        class="btn"
        id="leftBtn">
            ◀
        </div>

        <div
        class="btn"
        id="rightBtn">
            ▶
        </div>

    </div>

    <div class="rightPad">

        <div
        class="btn"
        id="jumpBtn">
            ▲
        </div>

        <div
        class="btn"
        id="dashBtn">
            ⚡
        </div>

        <div
        class="btn"
        id="shootBtn">
            🔥
        </div>

    </div>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* =====================
   ゲーム状態
===================== */

let gameStarted=false;

let score=0;

let stage=1;

let coins=0;

let combo=0;

let kills=0;

let gameTime=0;

/* =====================
   入力
===================== */

const keys={};

document.addEventListener(
"keydown",
e=>{

keys[
e.key.toLowerCase()
]=true;

});

document.addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
]=false;

});

function holdButton(
id,
key
){

const btn=
document.getElementById(id);

btn.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

keys[key]=true;

}
);

btn.addEventListener(
"pointerup",
()=>{

keys[key]=false;

}
);

btn.addEventListener(
"pointerleave",
()=>{

keys[key]=false;

}
);

btn.addEventListener(
"pointercancel",
()=>{

keys[key]=false;

}
);

}

holdButton(
"leftBtn",
"arrowleft"
);

holdButton(
"rightBtn",
"arrowright"
);

holdButton(
"shootBtn",
"x"
);

holdButton(
"dashBtn",
"shift"
);

/* Part1-Bへ続く */
/* =========================
   PLAYER
========================= */

const groundY = 835;

const player = {

    x:80,
    y:groundY-70,

    w:46,
    h:70,

    vx:0,
    vy:0,

    speed:5.5,
    jumpPower:-15,
    gravity:0.75,

    hp:5,
    maxHp:5,

    ammo:30,
    maxAmmo:30,

    reloadTime:0,
    reloadDuration:90,

    shootCooldown:0,
    fireRate:8,

    dashCooldown:0,
    dashDuration:0,

    invincible:0,

    onGround:false

};


/* =========================
   OBJECTS
========================= */

let bullets=[];
let enemyBullets=[];
let enemies=[];
let particles=[];
let coinsObj=[];


/* =========================
   ENEMY
========================= */

let spawnTimer=60;

function spawnEnemy(){

    const type=Math.random();

    let enemy;

    if(type<0.65){

        enemy={

            type:"normal",

            x:W+50,
            y:groundY-55,

            w:42,
            h:55,

            hp:2,
            maxHp:2,

            speed:2.5,

            shootTimer:
                80+Math.random()*100

        };

    }

    else if(type<0.85){

        enemy={

            type:"fast",

            x:W+50,
            y:groundY-45,

            w:34,
            h:45,

            hp:1,
            maxHp:1,

            speed:4.8,

            shootTimer:
                100+Math.random()*80

        };

    }

    else{

        enemy={

            type:"tank",

            x:W+50,
            y:groundY-80,

            w:58,
            h:80,

            hp:6,
            maxHp:6,

            speed:1.2,

            shootTimer:
                60+Math.random()*80

        };

    }

    enemies.push(enemy);

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!gameStarted) return;

    if(player.reloadTime>0) return;

    if(player.shootCooldown>0) return;

    if(player.ammo<=0){

        startReload();

        return;

    }

    bullets.push({

        x:player.x+player.w,

        y:player.y+27,

        w:20,

        h:6,

        speed:13,

        damage:1

    });

    player.ammo--;

    player.shootCooldown=
        player.fireRate;

    if(player.ammo<=0){

        startReload();

    }

}


/* =========================
   RELOAD
========================= */

function startReload(){

    if(player.reloadTime>0) return;

    if(player.ammo===player.maxAmmo)
        return;

    player.reloadTime=
        player.reloadDuration;

}


/* =========================
   DASH
========================= */

function dash(){

    if(
        !gameStarted ||
        player.dashCooldown>0 ||
        player.dashDuration>0
    ){
        return;
    }

    player.dashDuration=15;

    player.dashCooldown=180;

    player.invincible=20;

    player.vx=10;

}


/* =========================
   JUMP
========================= */

function jump(){

    if(
        player.onGround &&
        gameStarted
    ){

        player.vy=
            player.jumpPower;

        player.onGround=false;

    }

}


/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(enemy){

    enemyBullets.push({

        x:enemy.x,

        y:enemy.y+enemy.h/2,

        w:14,

        h:7,

        speed:-6,

        damage:1

    });

}


/* =========================
   PARTICLE
========================= */

function explosion(
    x,
    y,
    count=12
){

    for(let i=0;i<count;i++){

        const angle=
            Math.random()*Math.PI*2;

        const speed=
            1+Math.random()*5;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            life:
                20+Math.random()*30,

            size:
                2+Math.random()*5

        });

    }

}


/* =========================
   COIN
========================= */

function spawnCoin(x,y){

    coinsObj.push({

        x:x,
        y:y,

        r:10,

        speed:2

    });

}


/* =========================
   COLLISION
========================= */

function rectHit(a,b){

    return(

        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y

    );

}


/* =========================
   DAMAGE PLAYER
========================= */

function damagePlayer(){

    if(player.invincible>0)
        return;

    player.hp--;

    player.invincible=70;

    combo=0;

    explosion(
        player.x+player.w/2,
        player.y+player.h/2,
        25
    );

    if(player.hp<=0){

        gameStarted=false;

        alert(
            "GAME OVER\nSCORE : "+score
        );

    }

}


/* =========================
   KILL ENEMY
========================= */

function killEnemy(enemy){

    const index=
        enemies.indexOf(enemy);

    if(index>=0){

        enemies.splice(
            index,
            1
        );

    }

    kills++;

    combo++;

    score+=
        100+
        combo*10;

    if(Math.random()<0.3){

        spawnCoin(
            enemy.x,
            enemy.y
        );

    }

    explosion(
        enemy.x+enemy.w/2,
        enemy.y+enemy.h/2,
        20
    );

}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(){

    player.vx=0;

    if(keys["arrowleft"]){

        player.vx=
            -player.speed;

    }

    if(keys["arrowright"]){

        player.vx=
            player.speed;

    }

    if(keys["arrowup"]){

        keys["arrowup"]=false;

        jump();

    }

    if(keys["z"]){

        keys["z"]=false;

        jump();

    }

    if(keys["shift"]){

        keys["shift"]=false;

        dash();

    }

    if(keys["x"]){

        shoot();

    }


    /* DASH */

    if(player.dashDuration>0){

        player.dashDuration--;

        player.vx=12;

    }

    if(player.dashCooldown>0){

        player.dashCooldown--;

    }


    /* MOVE */

    player.x+=player.vx;

    player.x=Math.max(
        10,
        Math.min(
            W-player.w-10,
            player.x
        )
    );


    /* GRAVITY */

    player.vy+=
        player.gravity;

    player.y+=
        player.vy;


    /* GROUND */

    if(
        player.y+player.h>=groundY
    ){

        player.y=
            groundY-player.h;

        player.vy=0;

        player.onGround=true;

    }
    else{

        player.onGround=false;

    }


    /* INVINCIBLE */

    if(player.invincible>0){

        player.invincible--;

    }


    /* SHOOT COOLDOWN */

    if(player.shootCooldown>0){

        player.shootCooldown--;

    }


    /* RELOAD */

    if(player.reloadTime>0){

        player.reloadTime--;

        if(
            player.reloadTime===0
        ){

            player.ammo=
                player.maxAmmo;

        }

    }

}


/* =========================
   UPDATE BULLETS
========================= */

function updateBullets(){

    bullets.forEach(
        bullet=>{

            bullet.x+=
                bullet.speed;

        }
    );

    bullets=
        bullets.filter(
            b=>b.x<W+100
        );

}


/* =========================
   UPDATE ENEMY BULLETS
========================= */

function updateEnemyBullets(){

    enemyBullets.forEach(
        bullet=>{

            bullet.x+=
                bullet.speed;

        }
    );

    for(
        let i=
        enemyBullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            enemyBullets[i];

        if(
            rectHit(
                bullet,
                player
            )
        ){

            enemyBullets.splice(
                i,
                1
            );

            damagePlayer();

        }

    }

    enemyBullets=
        enemyBullets.filter(
            b=>b.x>-50
        );

}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies(){

    spawnTimer--;

    if(
        spawnTimer<=0 &&
        enemies.length<8
    ){

        spawnEnemy();

        spawnTimer=
            Math.max(
                25,
                75-stage*5
            );

    }


    enemies.forEach(
        enemy=>{

            enemy.x-=
                enemy.speed;

            enemy.shootTimer--;

            if(
                enemy.shootTimer<=0 &&
                enemy.x<W-50
            ){

                enemyShoot(enemy);

                enemy.shootTimer=
                    100+
                    Math.random()*100;

            }

        }
    );


    /* PLAYER HIT */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=
            enemies[i];

        if(
            rectHit(
                player,
                enemy
            )
        ){

            enemies.splice(
                i,
                1
            );

            damagePlayer();

            continue;

        }

        if(
            enemy.x< -100
        ){

            enemies.splice(
                i,
                1
            );

        }

    }


    /* BULLET HIT */

    for(
        let bi=bullets.length-1;
        bi>=0;
        bi--
    ){

        const bullet=
            bullets[bi];

        let hit=false;

        for(
            let ei=enemies.length-1;
            ei>=0;
            ei--
        ){

            const enemy=
                enemies[ei];

            if(
                rectHit(
                    bullet,
                    enemy
                )
            ){

                enemy.hp-=
                    bullet.damage;

                bullets.splice(
                    bi,
                    1
                );

                explosion(
                    bullet.x,
                    bullet.y,
                    6
                );

                hit=true;

                if(enemy.hp<=0){

                    killEnemy(
                        enemy
                    );

                }

                break;

            }

        }

        if(hit) continue;

    }

}


/* =========================
   UPDATE COINS
========================= */

function updateCoins(){

    coinsObj.forEach(
        coin=>{

            coin.x-=
                coin.speed;

        }
    );


    for(
        let i=coinsObj.length-1;
        i>=0;
        i--
    ){

        const coin=
            coinsObj[i];

        const box={

            x:
                coin.x-coin.r,

            y:
                coin.y-coin.r,

            w:
                coin.r*2,

            h:
                coin.r*2

        };

        if(
            rectHit(
                player,
                box
            )
        ){

            coins++;

            score+=50;

            coinsObj.splice(
                i,
                1
            );

        }

    }


    coinsObj=
        coinsObj.filter(
            c=>c.x>-50
        );

}


/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles(){

    particles.forEach(
        p=>{

            p.x+=p.vx;

            p.y+=p.vy;

            p.vy+=.12;

            p.life--;

        }
    );

    particles=
        particles.filter(
            p=>p.life>0
        );

}


/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!gameStarted){

        updateParticles();

        return;

    }

    gameTime++;

    updatePlayer();

    updateBullets();

    updateEnemyBullets();

    updateEnemies();

    updateCoins();

    updateParticles();

}


/* =========================
   START
========================= */

document
.getElementById("startBtn")
.addEventListener(
"click",
()=>{

    gameStarted=true;

    document
    .getElementById(
        "startScreen"
    )
    .style.display="none";

    player.hp=
        player.maxHp;

    player.ammo=
        player.maxAmmo;

    player.reloadTime=0;

    player.x=80;

    player.y=
        groundY-player.h;

}
);


/* Part1-Cへ続く */
/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

    /* SKY */

    const sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(
        0,
        "#55bdf5"
    );

    sky.addColorStop(
        .65,
        "#b9ecff"
    );

    sky.addColorStop(
        1,
        "#e7f8ff"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SUN */

    ctx.fillStyle=
        "rgba(255,240,150,.8)";

    ctx.beginPath();

    ctx.arc(
        W-80,
        125,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CLOUDS */

    ctx.fillStyle=
        "rgba(255,255,255,.75)";

    drawCloud(
        80,
        180,
        1
    );

    drawCloud(
        360,
        250,
        .8
    );

    drawCloud(
        180,
        100,
        .6
    );


    /* FAR MOUNTAINS */

    ctx.fillStyle="#79a9a0";

    ctx.beginPath();

    ctx.moveTo(0,600);

    ctx.lineTo(90,500);
    ctx.lineTo(180,585);
    ctx.lineTo(270,470);
    ctx.lineTo(370,580);
    ctx.lineTo(455,490);
    ctx.lineTo(540,575);

    ctx.lineTo(540,835);
    ctx.lineTo(0,835);

    ctx.closePath();

    ctx.fill();


    /* GROUND */

    ctx.fillStyle="#4f9b48";

    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    /* ROAD */

    ctx.fillStyle="#765438";

    ctx.fillRect(
        0,
        groundY-12,
        W,
        12
    );


    /* GRASS */

    ctx.fillStyle="#77bd55";

    for(
        let x=0;
        x<W;
        x+=35
    ){

        ctx.fillRect(
            x,
            groundY+5,
            18,
            5
        );

    }

}


/* =========================
   CLOUD
========================= */

function drawCloud(
    x,
    y,
    scale
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        28,
        0,
        Math.PI*2
    );

    ctx.arc(
        30,
        -12,
        35,
        0,
        Math.PI*2
    );

    ctx.arc(
        65,
        0,
        27,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    if(
        player.invincible>0 &&
        Math.floor(
            player.invincible/5
        )%2===0
    ){

        return;

    }


    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    /* BODY */

    ctx.fillStyle="#1976d2";

    ctx.fillRect(
        7,
        20,
        32,
        42
    );


    /* HEAD */

    ctx.fillStyle="#ffd2a6";

    ctx.beginPath();

    ctx.arc(
        23,
        14,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* HAIR */

    ctx.fillStyle="#222";

    ctx.fillRect(
        9,
        2,
        28,
        9
    );


    /* EYE */

    ctx.fillStyle="#111";

    ctx.fillRect(
        28,
        12,
        4,
        4
    );


    /* GUN */

    ctx.fillStyle="#222";

    ctx.fillRect(
        32,
        30,
        25,
        8
    );

    ctx.fillStyle="#555";

    ctx.fillRect(
        50,
        32,
        12,
        4
    );


    /* LEGS */

    ctx.fillStyle="#173d70";

    ctx.fillRect(
        9,
        60,
        11,
        10
    );

    ctx.fillRect(
        27,
        60,
        11,
        10
    );


    ctx.restore();

}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies(){

    enemies.forEach(
        enemy=>{

            ctx.save();

            ctx.translate(
                enemy.x,
                enemy.y
            );


            if(
                enemy.type==="normal"
            ){

                /* BODY */

                ctx.fillStyle=
                    "#d62828";

                ctx.fillRect(
                    5,
                    12,
                    enemy.w-10,
                    enemy.h-12
                );


                /* HEAD */

                ctx.fillStyle=
                    "#ffb28f";

                ctx.beginPath();

                ctx.arc(
                    enemy.w/2,
                    10,
                    13,
                    0,
                    Math.PI*2
                );

                ctx.fill();


                /* EYES */

                ctx.fillStyle="#111";

                ctx.fillRect(
                    13,
                    7,
                    4,
                    4
                );

                ctx.fillRect(
                    25,
                    7,
                    4,
                    4
                );

            }


            else if(
                enemy.type==="fast"
            ){

                ctx.fillStyle=
                    "#7b1fa2";

                ctx.fillRect(
                    3,
                    5,
                    enemy.w-6,
                    enemy.h-5
                );

                ctx.fillStyle="#ffccbc";

                ctx.fillRect(
                    8,
                    0,
                    enemy.w-16,
                    13
                );

            }


            else{

                ctx.fillStyle=
                    "#37474f";

                ctx.fillRect(
                    0,
                    10,
                    enemy.w,
                    enemy.h-10
                );

                ctx.fillStyle="#90a4ae";

                ctx.fillRect(
                    8,
                    0,
                    enemy.w-16,
                    22
                );

                ctx.fillStyle="#f44336";

                ctx.fillRect(
                    15,
                    7,
                    8,
                    5
                );

                ctx.fillRect(
                    35,
                    7,
                    8,
                    5
                );

            }


            /* HP BAR */

            const hpRate=
                enemy.hp/
                enemy.maxHp;

            ctx.fillStyle="#222";

            ctx.fillRect(
                0,
                -10,
                enemy.w,
                5
            );

            ctx.fillStyle="#4caf50";

            ctx.fillRect(
                0,
                -10,
                enemy.w*hpRate,
                5
            );


            ctx.restore();

        }
    );

}


/* =========================
   DRAW BULLETS
========================= */

function drawBullets(){

    bullets.forEach(
        bullet=>{

            ctx.fillStyle="#ffe600";

            ctx.fillRect(
                bullet.x,
                bullet.y,
                bullet.w,
                bullet.h
            );

            ctx.fillStyle="#fff";

            ctx.fillRect(
                bullet.x+2,
                bullet.y+1,
                8,
                2
            );

        }
    );


    enemyBullets.forEach(
        bullet=>{

            ctx.fillStyle="#ff1744";

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y+3,
                7,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* =========================
   DRAW COINS
========================= */

function drawCoins(){

    coinsObj.forEach(
        coin=>{

            ctx.fillStyle="#ffd600";

            ctx.beginPath();

            ctx.arc(
                coin.x,
                coin.y,
                coin.r,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#fff176";

            ctx.beginPath();

            ctx.arc(
                coin.x-3,
                coin.y-3,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles(){

    particles.forEach(
        p=>{

            ctx.globalAlpha=
                Math.max(
                    0,
                    p.life/40
                );

            ctx.fillStyle="#ff9800";

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );

        }
    );

    ctx.globalAlpha=1;

}


/* =========================
   DRAW UI
========================= */

function updateHUD(){

    document
    .getElementById(
        "score"
    )
    .textContent=
        "SCORE : "+score+
        "   COINS : "+coins+
        "   COMBO : "+combo;

    document
    .getElementById(
        "stage"
    )
    .textContent=
        "STAGE : "+stage+
        "   AMMO : "+
        player.ammo+
        "/"+
        player.maxAmmo;


    const hpRate=
        Math.max(
            0,
            player.hp/
            player.maxHp
        )*100;

    document
    .getElementById(
        "hpFill"
    )
    .style.width=
        hpRate+"%";


    let reloadRate=0;

    if(
        player.reloadTime>0
    ){

        reloadRate=
            (
                1-
                player.reloadTime/
                player.reloadDuration
            )*100;

    }

    document
    .getElementById(
        "reloadFill"
    )
    .style.width=
        reloadRate+"%";

}


/* =========================
   STAGE PROGRESS
========================= */

let stageTimer=0;

function updateStage(){

    stageTimer++;

    if(
        stageTimer>=1800
    ){

        stage++;

        stageTimer=0;

        score+=1000;

        /* 少しだけ敵を強くする */

        enemies.forEach(
            enemy=>{

                enemy.speed+=
                    .15;

            }
        );

    }

}


/* =========================
   SAVE
========================= */

function saveGame(){

    const saveData={

        score:score,

        stage:stage,

        coins:coins,

        kills:kills

    };

    localStorage.setItem(
        "red_or_dead_2_save",
        JSON.stringify(
            saveData
        )
    );

}


/* =========================
   LOAD
========================= */

function loadGame(){

    const data=
        localStorage.getItem(
            "red_or_dead_2_save"
        );

    if(!data) return;

    try{

        const saveData=
            JSON.parse(data);

        score=
            saveData.score||0;

        stage=
            saveData.stage||1;

        coins=
            saveData.coins||0;

        kills=
            saveData.kills||0;

    }
    catch(e){

        console.log(
            "Save data error"
        );

    }

}


/* =========================
   AUTO SAVE
========================= */

setInterval(
    ()=>{

        if(gameStarted){

            saveGame();

        }

    },
    5000
);


/* =========================
   DRAW
========================= */

function draw(){

    drawBackground();

    drawCoins();

    drawEnemies();

    drawBullets();

    drawPlayer();

    drawParticles();

    updateHUD();


    /* DASH EFFECT */

    if(
        player.dashDuration>0
    ){

        ctx.fillStyle=
            "rgba(255,255,255,.18)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    if(
        player.reloadTime>0
    ){

        ctx.fillStyle="#fff";

        ctx.font=
            "bold 24px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "RELOADING...",
            W/2,
            145
        );

        ctx.textAlign="left";

    }

}


/* =========================
   MAIN LOOP
========================= */

function loop(){

    update();

    if(gameStarted){

        updateStage();

    }

    draw();

    requestAnimationFrame(
        loop

}

/* =========================
   SPECIAL ENEMY VARIABLES
========================= */

let specialSpawnTimer = 240;
let stageBannerTimer = 0;
let stageBannerText = "";

let enemyWarnings = [];


/* =========================
   SPECIAL ENEMY SPAWN
========================= */

function spawnSpecialEnemy(){

    if(!gameStarted) return;

    const roll = Math.random();

    let enemy;


    /* 1. FLYING */

    if(roll < 0.35){

        enemy = {

            type:"flying",

            x:W+80,

            y:180+
              Math.random()*300,

            w:52,
            h:34,

            hp:3,
            maxHp:3,

            speed:2.4+

              stage*0.08,

            shootTimer:
              80+
              Math.random()*80,

            wave:Math.random()*
                 Math.PI*2,

            waveSpeed:
              0.06+
              Math.random()*0.03

        };

    }


    /* 2. CHARGER */

    else if(roll < 0.60){

        enemy = {

            type:"charger",

            x:W+100,

            y:groundY-65,

            w:52,
            h:65,

            hp:4,
            maxHp:4,

            speed:1.4+

              stage*0.06,

            chargeSpeed:
              9+

              stage*0.25,

            chargeTimer:
              100+
              Math.random()*100,

            charging:false,

            shootTimer:9999

        };

    }


    /* 3. SNIPER */

    else if(roll < 0.80){

        enemy = {

            type:"sniper",

            x:W+100,

            y:groundY-58,

            w:44,
            h:58,

            hp:3,
            maxHp:3,

            speed:1.0,

            shootTimer:
              80+
              Math.random()*100,

            warning:false

        };

    }


    /* 4. ELITE */

    else {

        enemy = {

            type:"elite",

            x:W+120,

            y:groundY-85,

            w:62,
            h:85,

            hp:12+
               stage*2,

            maxHp:12+
                stage*2,

            speed:1.0+
                  stage*0.03,

            shootTimer:
              60+
              Math.random()*80,

            shield:2

        };

    }


    enemies.push(enemy);

}


/* =========================
   WARNING
========================= */

function createWarning(
    text,
    duration=80
){

    enemyWarnings.push({

        text:text,

        life:duration,

        maxLife:duration

    });

}


/* =========================
   UPDATE WARNINGS
========================= */

function updateWarnings(){

    enemyWarnings.forEach(
        warning=>{

            warning.life--;

        }
    );

    enemyWarnings=
        enemyWarnings.filter(
            warning=>
                warning.life>0
        );

}


/* =========================
   SPECIAL SPAWN CONTROL
========================= */

function updateSpecialSpawn(){

    if(!gameStarted)
        return;

    specialSpawnTimer--;

    if(
        specialSpawnTimer<=0
    ){

        /*
           Stage 1:
           special enemy is rare

           Later stages:
           increasingly common
        */

        const chance=
            Math.min(
                0.85,
                0.25+
                stage*0.05
            );

        if(
            Math.random()<
            chance
        ){

            spawnSpecialEnemy();

        }


        specialSpawnTimer=
            Math.max(
                100,
                280-
                stage*12
            );

    }

}


/* =========================
   UPDATE SPECIAL ENEMIES
========================================================= */

function updateSpecialEnemies(){

    enemies.forEach(
        enemy=>{

            if(
                enemy.type==="flying"
            ){

                updateFlyingEnemy(
                    enemy
                );

            }


            else if(
                enemy.type==="charger"
            ){

                updateChargerEnemy(
                    enemy
                );

            }


            else if(
                enemy.type==="sniper"
            ){

                updateSniperEnemy(
                    enemy
                );

            }


            else if(
                enemy.type==="elite"
            ){

                updateEliteEnemy(
                    enemy
                );

            }

        }
    );

}


/* =========================
   FLYING ENEMY
========================= */

function updateFlyingEnemy(
    enemy
){

    enemy.x -=
        enemy.speed;


    enemy.wave +=
        enemy.waveSpeed;


    enemy.y +=
        Math.sin(
            enemy.wave
        )*2.5;


    enemy.shootTimer--;


    if(
        enemy.shootTimer<=0
    ){

        enemyBullets.push({

            x:enemy.x,

            y:enemy.y+
              enemy.h/2,

            w:16,
            h:7,

            speed:-6.5-

                  stage*0.1,

            damage:1

        });


        enemy.shootTimer=
            100+
            Math.random()*100;

    }

}


/* =========================
   CHARGER
========================= */

function updateChargerEnemy(
    enemy
){

    if(
        !enemy.charging
    ){

        enemy.x -=
            enemy.speed;

        enemy.chargeTimer--;


        if(
            enemy.chargeTimer<=0
        ){

            enemy.charging=true;

            createWarning(
                "⚠ CHARGER!",
                55
            );

        }

    }

    else{

        enemy.x -=
            enemy.chargeSpeed;

    }


    if(
        enemy.x<0
    ){

        enemy.charging=false;

        enemy.x=W+80;

        enemy.chargeTimer=
            100+
            Math.random()*100;

    }

}


/* =========================
   SNIPER
========================= */

function updateSniperEnemy(
    enemy
){

    enemy.x -=
        enemy.speed;


    enemy.shootTimer--;


    if(
        enemy.shootTimer<=45 &&
        !enemy.warning
    ){

        enemy.warning=true;

        createWarning(
            "🎯 SNIPER!",
            45
        );

    }


    if(
        enemy.shootTimer<=0
    ){

        /*
           Sniper bullet:
           faster than normal bullet
        */

        enemyBullets.push({

            x:enemy.x,

            y:enemy.y+
              enemy.h/2,

            w:28,
            h:5,

            speed:-12-

                  stage*0.2,

            damage:2

        });


        explosion(
            enemy.x,
            enemy.y+
            enemy.h/2,
            8
        );


        enemy.shootTimer=
            150+
            Math.random()*100;

        enemy.warning=false;

    }

}


/* =========================
   ELITE
========================= */

function updateEliteEnemy(
    enemy
){

    enemy.x -=
        enemy.speed;


    enemy.shootTimer--;


    if(
        enemy.shootTimer<=0
    ){

        /*
           3-way spread shot
        */

        for(
            let i=-1;
            i<=1;
            i++
        ){

            enemyBullets.push({

                x:enemy.x,

                y:enemy.y+
                  enemy.h/2,

                w:12,
                h:7,

                speed:
                    -6,

                vy:
                    i*1.7,

                damage:1

            });

        }


        enemy.shootTimer=
            90+
            Math.random()*70;

    }

}


/* =========================
   UPDATE ELITE BULLETS
========================= */

function updateEliteBullets(){

    enemyBullets.forEach(
        bullet=>{

            if(
                bullet.vy
            ){

                bullet.y +=
                    bullet.vy;

            }

        }
    );

}


/* =========================
   CHARGER COLLISION BOOST
========================= */

function specialEnemyCollision(){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=
            enemies[i];


        if(
            rectHit(
                player,
                enemy
            )
        ){

            /*
               Charger deals more damage
            */

            if(
                enemy.type==="charger"
            ){

                if(
                    player.invincible<=0
                ){

                    player.hp-=2;

                    player.invincible=
                        90;

                    combo=0;

                    explosion(
                        player.x+
                        player.w/2,

                        player.y+
                        player.h/2,

                        35
                    );

                }

            }

            else if(
                enemy.type==="elite"
            ){

                damagePlayer();

            }

            else{

                damagePlayer();

            }


            enemies.splice(
                i,
                1
            );

        }

    }

}


/* =========================
   SPECIAL BULLET DAMAGE
========================= */

function updateSpecialBulletDamage(){

    for(
        let i=
            enemyBullets.length-1;

        i>=0;

        i--
    ){

        const bullet=
            enemyBullets[i];


        if(
            rectHit(
                bullet,
                player
            )
        ){

            enemyBullets.splice(
                i,
                1
            );


            if(
                bullet.damage>=2
            ){

                if(
                    player.invincible<=0
                ){

                    player.hp-=
                        bullet.damage;

                    player.invincible=
                        80;

                    combo=0;

                    explosion(
                        player.x+
                        player.w/2,

                        player.y+
                        player.h/2,

                        30
                    );

                }

            }

            else{

                damagePlayer();

            }

        }

    }

}


/* =========================
   DRAW SPECIAL ENEMIES
========================= */

function drawSpecialEnemies(){

    enemies.forEach(
        enemy=>{

            if(
                enemy.type==="normal" ||
                enemy.type==="fast" ||
                enemy.type==="tank"
            ){

                return;

            }


            ctx.save();

            ctx.translate(
                enemy.x,
                enemy.y
            );


            /* FLYING */

            if(
                enemy.type==="flying"
            ){

                ctx.fillStyle=
                    "#673ab7";

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    enemy.h/2
                );

                ctx.lineTo(
                    enemy.w/2,
                    0
                );

                ctx.lineTo(
                    enemy.w,
                    enemy.h/2
                );

                ctx.lineTo(
                    enemy.w/2,
                    enemy.h
                );

                ctx.closePath();

                ctx.fill();


                ctx.fillStyle=
                    "#ffeb3b";

                ctx.fillRect(
                    16,
                    12,
                    7,
                    7
                );

                ctx.fillRect(
                    31,
                    12,
                    7,
                    7
                );

            }


            /* CHARGER */

            else if(
                enemy.type==="charger"
            ){

                ctx.fillStyle=
                    "#ff5722";

                ctx.fillRect(
                    0,
                    10,
                    enemy.w,
                    enemy.h-10
                );


                ctx.fillStyle=
                    "#bf360c";

                ctx.fillRect(
                    5,
                    0,
                    enemy.w-10,
                    20
                );


                ctx.fillStyle=
                    "#fff";

                ctx.beginPath();

                ctx.moveTo(
                    8,
                    5
                );

                ctx.lineTo(
                    0,
                    -8
                );

                ctx.lineTo(
                    18,
                    3
                );

                ctx.closePath();

                ctx.fill();


                ctx.beginPath();

                ctx.moveTo(
                    enemy.w-8,
                    5
                );

                ctx.lineTo(
                    enemy.w,
                    -8
                );

                ctx.lineTo(
                    enemy.w-18,
                    3
                );

                ctx.closePath();

                ctx.fill();

            }


            /* SNIPER */

            else if(
                enemy.type==="sniper"
            ){

                ctx.fillStyle=
                    "#263238";

                ctx.fillRect(
                    3,
                    8,
                    enemy.w-6,
                    enemy.h-8
                );


                ctx.fillStyle=
                    "#ff1744";

                ctx.fillRect(
                    11,
                    12,
                    7,
                    7
                );

                ctx.fillRect(
                    26,
                    12,
                    7,
                    7
                );


                ctx.fillStyle=
                    "#111";

                ctx.fillRect(
                    25,
                    30,
                    28,
                    5
                );

            }


            /* ELITE */

            else if(
                enemy.type==="elite"
            ){

                ctx.fillStyle=
                    "#111";

                ctx.fillRect(
                    0,
                    8,
                    enemy.w,
                    enemy.h-8
                );


                ctx.strokeStyle=
                    "#ff1744";

                ctx.lineWidth=4;

                ctx.strokeRect(
                    2,
                    10,
                    enemy.w-4,
                    enemy.h-12
                );


                ctx.fillStyle=
                    "#ff1744";

                ctx.fillRect(
                    12,
                    16,
                    10,
                    8
                );

                ctx.fillRect(
                    40,
                    16,
                    10,
                    8
                );


                /* SHIELD */

                if(
                    enemy.shield>0
                ){

                    ctx.strokeStyle=
                        "rgba(0,220,255,.8)";

                    ctx.lineWidth=5;

                    ctx.beginPath();

                    ctx.arc(
                        enemy.w/2,
                        enemy.h/2,
                        enemy.w/2+8,
                        0,
                        Math.PI*2
                    );

                    ctx.stroke();

                }

            }


            /* HP BAR */

            const hpRate=
                enemy.hp/
                enemy.maxHp;


            ctx.fillStyle="#222";

            ctx.fillRect(
                0,
                -14,
                enemy.w,
                6
            );


            ctx.fillStyle="#00e676";

            ctx.fillRect(
                0,
                -14,
                enemy.w*hpRate,
                6
            );


            ctx.restore();

        }
    );

}


/* =========================
   ELITE SHIELD
========================= */

function damageElite(
    enemy,
    damage
){

    if(
        enemy.shield>0
    ){

        enemy.shield--;

        explosion(
            enemy.x+
            enemy.w/2,

            enemy.y+
            enemy.h/2,

            10
        );

        return false;

    }


    enemy.hp-=damage;

    return true;

}


/* =========================
   REPLACE BULLET HIT
========================= */

function handleSpecialBulletHits(){

    for(
        let bi=
            bullets.length-1;

        bi>=0;

        bi--
    ){

        const bullet=
            bullets[bi];

        for(
            let ei=
                enemies.length-1;

            ei>=0;

            ei--
        ){

            const enemy=
                enemies[ei];


            if(
                rectHit(
                    bullet,
                    enemy
                )
            ){

                bullets.splice(
                    bi,
                    1
                );


                let damaged=true;


                if(
                    enemy.type==="elite"
                ){

                    damaged=
                        damageElite(
                            enemy,
                            bullet.damage
                        );

                }

                else{

                    enemy.hp-=
                        bullet.damage;

                }


                explosion(
                    bullet.x,
                    bullet.y,
                    6
                );


                if(
                    damaged &&
                    enemy.hp<=0
                ){

                    killEnemy(
                        enemy
                    );

                }


                break;

            }

        }

    }

}


/* =========================
   STAGE BANNER
========================= */

function showStageBanner(){

    stageBannerText=
        "STAGE "+
        stage;

    stageBannerTimer=
        120;

}


function updateStageBanner(){

    if(
        stageBannerTimer>0
    ){

        stageBannerTimer--;

    }

}


function drawStageBanner(){

    if(
        stageBannerTimer<=0
    )
        return;


    const alpha=
        Math.min(
            1,
            stageBannerTimer/30
        );


    ctx.save();

    ctx.globalAlpha=
        alpha;

    ctx.fillStyle=
        "rgba(0,0,0,.65)";

    ctx.fillRect(
        0,
        H/2-70,
        W,
        140
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 64px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        stageBannerText,
        W/2,
        H/2+22
    );


    ctx.restore();

}


/* =========================
   STAGE CHANGE OVERRIDE
========================= */

const oldUpdateStage=
    updateStage;

updateStage=function(){

    const oldStage=
        stage;

    oldUpdateStage();

    if(
        stage!==oldStage
    ){

        showStageBanner();

        explosion(
            W/2,
            H/2,
            50
        );

    }

    updateStageBanner();

};


/* =========================
   WARNING DRAW
========================= */

function drawWarnings(){

    if(
        enemyWarnings.length===0
    )
        return;


    ctx.save();

    ctx.textAlign="center";

    ctx.font=
        "bold 34px Arial";


    enemyWarnings.forEach(
        warning=>{

            const alpha=
                Math.min(
                    1,
                    warning.life/15
                );


            ctx.globalAlpha=
                alpha;

            ctx.fillStyle=
                "#ff1744";


            ctx.fillText(
                warning.text,
                W/2,

/* =========================
   FEVER GAIN
========================= */

function addFever(amount){

    if(feverActive)
        return;

    feverGauge += amount;

    feverGauge =
        Math.min(
            feverMax,
            feverGauge
        );


    if(
        feverGauge >= feverMax
    ){

        startFever();

    }

}


/* =========================
   START FEVER
========================= */

function startFever(){

    feverActive = true;

    feverTime = 600;

    feverGauge = 0;

    score += 500;

    createWarning(
        "🔥 FEVER!",
        90
    );


    explosion(
        player.x+
        player.w/2,

        player.y+
        player.h/2,

        60
    );

}


/* =========================
   UPDATE FEVER
========================= */

function updateFever(){

    if(
        feverActive
    ){

        feverTime--;

        if(
            feverTime<=0
        ){

            feverActive=false;

        }

    }

}


/* =========================
   COMBO UPDATE
========================= */

function updateCombo(){

    if(
        combo>0
    ){

        comboTimer--;

        if(
            comboTimer<=0
        ){

            combo=0;

        }

    }

}


/* =========================
   REPLACE KILL FUNCTION
========================= */

const oldKillEnemy=
    killEnemy;

killEnemy=function(enemy){

    oldKillEnemy(enemy);

    comboTimer=
        comboTimeout;


    /* FEVER BONUS */

    addFever(
        enemy.type==="elite"
            ? 18
            : 8
    );


    /* FEVER SCORE */

    if(
        feverActive
    ){

        score +=
            100+
            combo*20;

    }

};


/* =========================
   MINI BOSS SPAWN
========================= */

function spawnMiniBoss(){

    if(
        miniBoss ||
        !gameStarted
    )
        return;


    miniBoss={

        type:"miniBoss",

        x:W+150,

        y:groundY-150,

        w:110,

        h:150,

        hp:
            80+
            stage*20,

        maxHp:
            80+
            stage*20,

        speed:
            0.8+

            stage*0.03,

        shootTimer:70,

        attackTimer:150,

        phase:0,

        moveTimer:0

    };


    enemies.push(
        miniBoss
    );


    miniBossWarning=120;


    createWarning(
        "⚠ MINI BOSS ⚠",
        120
    );

}


/* =========================
   MINI BOSS UPDATE
========================= */

function updateMiniBoss(){

    if(
        !miniBoss
    )
        return;


    if(
        miniBoss.x>
        W-170
    ){

        miniBoss.x -=
            miniBoss.speed;

    }


    miniBoss.moveTimer++;


    /*
       上下移動
    */

    miniBoss.y =
        groundY-150+
        Math.sin(
            miniBoss.moveTimer*
            0.025
        )*65;


    miniBoss.shootTimer--;


    if(
        miniBoss.shootTimer<=0
    ){

        miniBossShoot();

        miniBoss.shootTimer=
            65+
            Math.random()*35;

    }


    miniBoss.attackTimer--;


    if(
        miniBoss.attackTimer<=0
    ){

        miniBossSpecialAttack();

        miniBoss.attackTimer=
            180+
            Math.random()*100;

    }


    if(
        miniBoss.hp<=0
    ){

        defeatMiniBoss();

    }

}


/* =========================
   MINI BOSS SHOOT
========================= */

function miniBossShoot(){

    if(!miniBoss)
        return;


    /*
       5方向弾
    */

    for(
        let i=-2;
        i<=2;
        i++
    ){

        enemyBullets.push({

            x:
                miniBoss.x,

            y:
                miniBoss.y+
                miniBoss.h/2,

            w:16,

            h:9,

            speed:
                -6.5,

            vy:
                i*1.5,

            damage:1

        });

    }


    explosion(
        miniBoss.x,
        miniBoss.y+
        miniBoss.h/2,
        15
    );

}


/* =========================
   MINI BOSS SPECIAL ATTACK
========================= */

function miniBossSpecialAttack(){

    if(!miniBoss)
        return;


    createWarning(
        "⚠ ATTACK!",
        45
    );


    /*
       地上に危険エリアを作る
    */

    particles.push({

        x:20,

        y:groundY-8,

        vx:0,

        vy:0,

        life:45,

        size:W

    });


    /*
       大量弾
    */

    for(
        let i=0;
        i<8;
        i++
    ){

        enemyBullets.push({

            x:
                miniBoss.x,

            y:
                miniBoss.y+
                miniBoss.h/2,

            w:12,

            h:12,

            speed:
                -4-
                Math.random()*3,

            vy:
                (Math.random()-
                .5)*7,

            damage:1

        });

    }

}


/* =========================
   MINI BOSS DEFEAT
========================= */

function defeatMiniBoss(){

    const boss=
        miniBoss;


    miniBoss=null;


    const index=
        enemies.indexOf(
            boss
        );


    if(index>=0){

        enemies.splice(
            index,
            1
        );

    }


    score +=
        5000+
        stage*500;


    coins +=
        20+
        stage*2;


    combo += 5;


    feverGauge=
        feverMax;


    for(
        let i=0;
        i<120;
        i++
    ){

        particles.push({

            x:
                boss.x+
                Math.random()*
                boss.w,

            y:
                boss.y+
                Math.random()*
                boss.h,

            vx:
                (Math.random()-
                .5)*12,

            vy:
                (Math.random()-
                .5)*12,

            life:
                30+
                Math.random()*60,

            size:
                3+
                Math.random()*8

        });

    }


    createWarning(
        "💥 BOSS DEFEATED!",
        120
    );

}


/* =========================
   MINI BOSS SPAWN TIMER
========================= */

function updateMiniBossTimer(){

    if(
        miniBoss
    )
        return;


    miniBossTimer--;


    /*
       30秒ごと
    */

    if(
        miniBossTimer<=0
    ){

        spawnMiniBoss();

        miniBossTimer=
            Math.max(
                1200,
                2400-
                stage*100
            );

    }

}


/* =========================
   MINI BOSS COLLISION
========================= */

function miniBossCollision(){

    if(
        !miniBoss
    )
        return;


    if(
        rectHit(
            player,
            miniBoss
        )
    ){

        damagePlayer();

    }

}


/* =========================
   MINI BOSS BULLET COLLISION
========================= */

function miniBossBulletCollision(){

    if(
        !miniBoss
    )
        return;


    for(
        let i=
            bullets.length-1;

        i>=0;

        i--
    ){

        const bullet=
            bullets[i];


        if(
            rectHit(
                bullet,
                miniBoss
            )
        ){

            bullets.splice(
                i,
                1
            );


            miniBoss.hp -=
                bullet.damage;


            score += 10;


            explosion(
                bullet.x,
                bullet.y,
                8
            );


            if(
                miniBoss.hp<=0
            ){

                defeatMiniBoss();

            }

        }

    }

}


/* =========================
   DRAW FEVER BAR
========================= */

function drawFeverBar(){

    const x=15;
    const y=120;
    const width=W-30;
    const height=12;


    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    const rate=
        feverActive
        ? feverTime/600
        : feverGauge/
          feverMax;


    ctx.fillStyle=
        "#ff9800";

    ctx.fillRect(
        x,
        y,
        width*
        Math.max(
            0,
            Math.min(
                1,
                rate
            )
        ),
        height
    );


    ctx.strokeStyle=
        "rgba(255,255,255,.7)";

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 12px Arial";

    ctx.textAlign="center";


    ctx.fillText(
        feverActive
            ? "FEVER "+Math.ceil(
                feverTime/60
              )+"s"
            : "FEVER",
        W/2,
        y+10
    );


    ctx.textAlign="left";

}


/* =========================
   DRAW MINI BOSS
========================= */

function drawMiniBoss(){

    if(
        !miniBoss
    )
        return;


    const boss=
        miniBoss;


    ctx.save();


    ctx.translate(
        boss.x,
        boss.y
    );


    /* AURA */

    ctx.fillStyle=
        "rgba(255,0,50,.15)";

    ctx.beginPath();

    ctx.arc(
        boss.w/2,
        boss.h/2,
        85+
        Math.sin(
            gameTime*.1
        )*10,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BODY */

    ctx.fillStyle=
        "#171717";

    ctx.fillRect(
        8,
        20,
        boss.w-16,
        boss.h-20
    );


    /* ARMOR */

    ctx.strokeStyle=
        "#ff1744";

    ctx.lineWidth=6;

    ctx.strokeRect(
        10,
        22,
        boss.w-20,
        boss.h-30
    );


    /* HEAD */

    ctx.fillStyle=
        "#424242";

    ctx.beginPath();

    ctx.arc(
        boss.w/2,
        20,
        28,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* EYES */

    ctx.fillStyle=
        "#ff1744";

    ctx.fillRect(
        23,
        14,
        14,
        7
    );

    ctx.fillRect(
        73,
        14,
        14,
        7
    );


    /* CORE */

    ctx.fillStyle=
        feverActive
            ? "#ffeb3b"
            : "#ff1744";

    ctx.beginPath();

    ctx.arc(
        boss.w/2,
        75,
        18+
        Math.sin(
            gameTime*.15
        )*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();


    /* BOSS HP */

    const barW=
        W-40;

    const barX=20;

    const barY=
        boss.y-25;


    ctx.fillStyle="#222";

    ctx.fillRect(
        barX,
        barY,
        barW,
        14
    );


    ctx.fillStyle=
        "#ff1744";

    ctx.fillRect(
        barX,
        barY,
        barW*
        Math.max(
            0,
            boss.hp/
            boss.maxHp
        ),
        14
    );


    ctx.strokeStyle="#fff";

    ctx.strokeRect(
        barX,
        barY,
        barW,
        14
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 14px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "MINI BOSS",
        W/2,
        barY-7
    );

    ctx.textAlign="left";

}

            ctx.fillStyle=

                "#fff";

            ctx.strokeStyle=

                "#111";

            ctx.lineWidth=4;

            ctx.strokeText(

                effect.text,

                effect.x,

                effect.y

            ctx.fillText(

                effect.text,

                effect.x,

            );

    );

    hud.style.webkitBackdropFilter=

        "blur(5px)";

    const reload=

        document.getElementById(

            "reloadBar"

        );

    reload.style.height=

        "8px";

    const hp=

        document.getElementById(

            "hpBar"

        );

    hp.style.height=

        "12px";

}
